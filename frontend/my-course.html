<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Kou — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <a class="back-link" href="dashboard.html" data-i18n>Tablo de bò</a>

        <div id="content"><p class="loading" data-i18n>Ap chaje…</p></div>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, fmt, h, ApiError, shell, t } = Konbit;

    // Pa gen restriksyon wòl — nenpòt moun konekte ka gade pwòp kou li.
    const identity = await shell.mount(null);
    if (!identity) return;

    const content = document.getElementById('content');
    const courseId = Number(new URLSearchParams(location.search).get('id'));

    if (!Number.isInteger(courseId) || courseId <= 0) {
      content.replaceChildren(h('div', { class: 'alert alert-error' }, t('Pa gen kou chwazi.')));
      return;
    }

    const SAVE_EVERY_MS = 20000;
    const WATCH_THRESHOLD = 0.9;      // menm ak backend (training.WATCH_THRESHOLD)

    let data = null;                  // MyCourseDetail: enrollment, course, lessons[], next_lesson_id
    let activeLessonId = null;
    let saveTimer = null;
    let tracker = null;               // videyo fichye k ap jwe a: { lessonId, video, watched, last }
    let refreshProgress = () => {};

    function errorMessage(err) {
      return err instanceof ApiError ? err.message : t('Yon bagay pa mache.');
    }

    /** 125 → "2:05" (minit:segonn), menm fòma nan tout lang. */
    function durationLabel(seconds) {
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    // -------------------------------------------------------------------
    // KALITE LYEN VIDEYO A
    //
    // YouTube (watch, youtu.be, embed, shorts, live, m.), Vimeo (ak lyen
    // prive /ID/HASH), Google Drive (/file/d/ID/…), oswa yon fichye.
    // Yon lyen ki pa http(s) = "invalid": nou pa janm mete l nan paj la.
    // -------------------------------------------------------------------

    function parseVideo(url) {
      const raw = (url || '').trim();
      if (!raw) return { type: 'none' };
      let u;
      try {
        u = new URL(raw);
      } catch {
        return { type: 'invalid' };
      }
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return { type: 'invalid' };
      const host = u.hostname.replace(/^(www|m)\./, '');

      let yt = null;
      if (host === 'youtu.be') {
        yt = u.pathname.slice(1).split('/')[0];
      } else if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
        const m = u.pathname.match(/^\/(?:embed|shorts|live)\/([\w-]{11})/);
        yt = u.searchParams.get('v') || (m ? m[1] : null);
      }
      if (yt && /^[\w-]{11}$/.test(yt)) return { type: 'youtube', id: yt };

      if (host === 'vimeo.com' || host === 'player.vimeo.com') {
        const m = u.pathname.match(/\/(\d{5,})(?:\/([0-9a-f]{6,}))?/);
        if (m) return { type: 'vimeo', id: m[1], hash: m[2] || u.searchParams.get('h') };
      }

      if (host === 'drive.google.com') {
        const m = u.pathname.match(/\/file\/d\/([\w-]+)/);
        const id = m ? m[1] : u.searchParams.get('id');
        if (id && /^[\w-]+$/.test(id)) return { type: 'drive', id };
      }

      return { type: 'file', url: u.href };
    }

    function embedFrame(src, allow) {
      return h('div', { style: 'position: relative; padding-top: 56.25%; border-radius: var(--radius); overflow: hidden; background: #000;' },
        h('iframe', {
          src, allow, allowfullscreen: true, loading: 'lazy',
          style: 'position: absolute; inset: 0; width: 100%; height: 100%; border: 0;',
        }),
      );
    }

    // -------------------------------------------------------------------
    // SOVE PWOGRÈ
    // -------------------------------------------------------------------

    async function saveProgress(lessonId, secondsWatched, lastPosition, completed) {
      const item = data.lessons.find((x) => x.lesson.id === lessonId);
      try {
        const result = await api.post('/api/training/me/progress', {
          lesson_id: lessonId,
          seconds_watched: Math.round(secondsWatched),
          last_position_seconds: Math.round(lastPosition),
          completed: Boolean(completed),
        });
        data.enrollment.progress_percent = result.course_progress_percent;
        if (result.course_completed && !data.enrollment.completed_at) {
          data.enrollment.completed_at = new Date().toISOString();
        }
        if (item) {
          item.completed = result.completed;
          item.seconds_watched = Math.max(item.seconds_watched || 0, Math.round(secondsWatched));
          item.last_position_seconds = Math.round(lastPosition);
        }
        refreshProgress();
        return result;
      } catch {
        return null;   // pa grav si yon voye rate — pwochen an ap eseye ankò
      }
    }

    /** Sove tan ki VRÈMAN gade (pa pozisyon an: moun nan ka sote rive nan fen). */
    function saveTracker(track, completed) {
      const v = track.video;
      const dur = Number.isFinite(v.duration) ? v.duration : 0;
      const watched = dur ? Math.min(track.watched, dur) : track.watched;
      return saveProgress(track.lessonId, watched, v.currentTime || 0, completed);
    }

    function stopTimer() {
      clearInterval(saveTimer);
      saveTimer = null;
    }

    // Moun nan fèmen onglet la, chanje aplikasyon, oswa telefòn nan fèmen:
    // sove kote l rive a olye nou pèdi jiska 20 segonn.
    function saveIfPlaying() {
      if (tracker && !tracker.video.paused) saveTracker(tracker, false);
    }
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveIfPlaying(); });
    window.addEventListener('pagehide', saveIfPlaying);

    // -------------------------------------------------------------------
    // CHAJE
    // -------------------------------------------------------------------

    async function load() {
      try {
        data = await api.get(`/api/training/me/courses/${courseId}`);
        activeLessonId = data.next_lesson_id || (data.lessons[0] && data.lessons[0].lesson.id) || null;
        render();
      } catch (err) {
        content.replaceChildren(h('div', { class: 'alert alert-error' }, errorMessage(err)));
      }
    }

    // -------------------------------------------------------------------
    // RANN
    // -------------------------------------------------------------------

    function render() {
      document.title = `${data.course.title} — KONMBIT`;

      const progressWrap = h('div', {});
      const lessonListWrap = h('div', {});
      const playerWrap = h('div', {});
      const completeMsg = h('p', { class: 'field-error', role: 'status' });
      const completeBtn = h('button', { class: 'btn btn-primary', type: 'button' }, t('Fini kou a'));

      completeBtn.addEventListener('click', async () => {
        completeMsg.textContent = '';
        completeBtn.disabled = true;
        try {
          const enr = await api.post(`/api/training/me/courses/${courseId}/complete`, {});
          data.enrollment = enr;
          refreshProgress();
          completeMsg.className = 'hint';
          completeMsg.textContent = t('Bravo! Ou fini kou a.');
        } catch (err) {
          completeMsg.className = 'field-error';
          completeMsg.textContent = errorMessage(err);
        } finally {
          completeBtn.disabled = false;
        }
      });

      refreshProgress = function () {
        const pct = data.enrollment.progress_percent;
        const done = Boolean(data.enrollment.completed_at);
        const bar = h('div', {
          class: done ? 'bar done' : 'bar', role: 'progressbar', style: 'margin-top: 10px;',
          'aria-valuenow': String(pct), 'aria-valuemin': '0', 'aria-valuemax': '100',
          'aria-label': t('Pwogrè: {title}', { title: data.course.title }),
        }, h('span', {}));
        bar.firstChild.style.width = `${pct}%`;
        progressWrap.replaceChildren(
          bar,
          h('p', { class: 'sub', style: 'margin-top: 6px;' },
            done ? t('Fini — {pct}%', { pct }) : t('{pct}% konplete', { pct })),
        );
        completeBtn.hidden = done || pct < 100;
        renderLessonList();
      };

      function nextLessonId() {
        const i = data.lessons.findIndex((x) => x.lesson.id === activeLessonId);
        return i >= 0 && i + 1 < data.lessons.length ? data.lessons[i + 1].lesson.id : null;
      }

      function renderLessonList() {
        lessonListWrap.replaceChildren(
          h('ul', { class: 'plain-list' }, ...data.lessons.map((item) => {
            const l = item.lesson;
            const isActive = l.id === activeLessonId;
            // Tit leson yo ekri pa HR: yo rete jan yo ye.
            const link = h('a', {
              href: '#',
              class: 'plain-link',
              style: isActive ? 'font-weight: 700; color: var(--text);' : '',
              'aria-current': isActive ? 'true' : null,
            }, `${item.completed ? '✓ ' : ''}${l.title}`);
            link.addEventListener('click', (e) => {
              e.preventDefault();
              selectLesson(l.id);
            });
            return h('li', {}, link,
              l.duration_seconds ? h('span', { class: 'num' }, durationLabel(l.duration_seconds)) : null);
          })),
        );
      }

      function selectLesson(lessonId) {
        // Pause la sove kote nou te ye nan ansyen leson an (gade 'pause' anba a).
        if (tracker && !tracker.video.paused) tracker.video.pause();
        activeLessonId = lessonId;
        renderPlayer();
        renderLessonList();
        playerWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      function fileVideo(item, lesson, url) {
        const v = h('video', {
          controls: true, playsinline: true, preload: 'metadata',
          style: 'width: 100%; border-radius: var(--radius); background: #000;',
        });
        v.src = url;
        const err = h('p', { class: 'field-error', role: 'status' });
        const track = { lessonId: lesson.id, video: v, watched: item.seconds_watched || 0, last: null };
        tracker = track;

        v.addEventListener('loadedmetadata', () => {
          const pos = item.last_position_seconds || 0;
          // Si moun nan te rive nan fen an, li rekòmanse nan kòmansman.
          if (pos > 0 && (!v.duration || pos < v.duration - 5)) v.currentTime = pos;
        });

        // Tan ki VRÈMAN gade: nou adisyone ti pa yo pandan videyo a ap jwe.
        // Yon sote (seeking) oswa yon pa pi gwo pase 2 s pa konte.
        v.addEventListener('timeupdate', () => {
          const now = v.currentTime;
          if (track.last !== null && !v.seeking) {
            const delta = now - track.last;
            if (delta > 0 && delta < 2) track.watched += delta;
          }
          track.last = now;
        });
        v.addEventListener('seeking', () => { track.last = null; });

        v.addEventListener('play', () => {
          track.last = v.currentTime;
          stopTimer();
          saveTimer = setInterval(() => saveTracker(track, false), SAVE_EVERY_MS);
        });
        v.addEventListener('pause', () => {
          if (tracker === track) stopTimer();
          saveTracker(track, false);
        });
        v.addEventListener('ended', () => {
          const dur = Number.isFinite(v.duration) ? v.duration : 0;
          saveTracker(track, !dur || track.watched >= dur * WATCH_THRESHOLD);
        });
        v.addEventListener('error', () => {
          err.textContent = t('Lyen videyo sa a pa valab. Pale ak HR.');
        });

        return h('div', {}, v, err);
      }

      function manualWatchedButton(item, lesson) {
        const btn = h('button', { class: 'btn btn-ghost btn-sm', type: 'button', style: 'margin-top: 12px;' },
          item.completed ? t('Videyo make fini ✓') : t('Mwen fini gade videyo sa a'));
        btn.disabled = item.completed;
        btn.addEventListener('click', async () => {
          btn.disabled = true;
          const result = await saveProgress(lesson.id, lesson.duration_seconds || 0, lesson.duration_seconds || 0, true);
          if (result) btn.textContent = t('Videyo make fini ✓');
          else btn.disabled = false;
        });
        return h('div', {}, btn,
          h('p', { class: 'hint' }, t('Videyo sa a pa ka swiv pwogrè otomatikman — klike lè w fini gade l.')));
      }

      function renderPlayer() {
        stopTimer();
        tracker = null;

        const item = data.lessons.find((x) => x.lesson.id === activeLessonId);
        if (!item) {
          playerWrap.replaceChildren(h('p', { class: 'empty' }, t('Pa gen leson.')));
          return;
        }
        const lesson = item.lesson;
        const video = parseVideo(lesson.video_url);
        const blocks = [h('h2', { style: 'font-size: 18px; margin-bottom: 12px;' }, lesson.title)];

        if (video.type === 'youtube') {
          blocks.push(embedFrame(
            `https://www.youtube-nocookie.com/embed/${encodeURIComponent(video.id)}?rel=0`,
            'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen',
          ), manualWatchedButton(item, lesson));
        } else if (video.type === 'vimeo') {
          const hash = video.hash ? `?h=${encodeURIComponent(video.hash)}` : '';
          blocks.push(embedFrame(
            `https://player.vimeo.com/video/${encodeURIComponent(video.id)}${hash}`,
            'autoplay; fullscreen; picture-in-picture',
          ), manualWatchedButton(item, lesson));
        } else if (video.type === 'drive') {
          blocks.push(embedFrame(
            `https://drive.google.com/file/d/${encodeURIComponent(video.id)}/preview`,
            'autoplay; fullscreen',
          ), manualWatchedButton(item, lesson));
        } else if (video.type === 'file') {
          blocks.push(fileVideo(item, lesson, video.url));
        } else if (video.type === 'invalid') {
          blocks.push(h('p', { class: 'empty' }, t('Lyen videyo sa a pa valab. Pale ak HR.')));
        } else {
          blocks.push(h('p', { class: 'empty' }, t('Pa gen videyo pou leson sa a.')));
        }

        // Deskripsyon an ekri pa HR: li rete jan l ye.
        if (lesson.description) {
          blocks.push(h('p', { class: 'sub', style: 'margin-top: 14px; white-space: pre-wrap;' }, lesson.description));
        }

        const nextId = nextLessonId();
        if (nextId) {
          const next = h('button', { class: 'btn btn-ghost btn-sm', type: 'button', style: 'margin-top: 14px;' },
            `${t('Pwochen leson')} →`);
          next.addEventListener('click', () => selectLesson(nextId));
          blocks.push(h('div', {}, next));
        }

        playerWrap.replaceChildren(...blocks);
      }

      renderLessonList();
      renderPlayer();
      refreshProgress();

      content.replaceChildren(
        h('div', { class: 'page-head' },
          h('h1', {}, data.course.title),
          data.enrollment.due_date
            ? h('p', {}, t('Delè: {date}', { date: fmt.shortDate(data.enrollment.due_date) }))
            : null,
          progressWrap,
        ),
        h('div', { class: 'grid' },
          h('div', { class: 'col' },
            h('section', { class: 'panel' }, playerWrap),
            h('section', { class: 'panel', style: 'margin-top: 16px;' }, completeBtn, completeMsg),
          ),
          h('div', { class: 'col' },
            h('section', { class: 'panel' },
              h('div', { class: 'panel-head' }, h('h2', {}, t('Leson yo'))),
              lessonListWrap,
            ),
          ),
        ),
      );
    }

    load();
  })();
  </script>
</body>
</html>
