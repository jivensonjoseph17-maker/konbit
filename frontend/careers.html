<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karyè — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    /* Paj piblik: pa gen meni HR, jis yon kolòn santre. */
    .careers {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    .careers-head { margin-bottom: 24px; }
    .careers-head .company { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
    .careers-head h1 { margin: 0; }
    .job-list { display: grid; gap: 12px; }
    .job-item {
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: inherit;
      text-decoration: none;
    }
    .job-item:hover, .job-item:focus-visible { border-color: currentColor; }
    .job-item h2 { font-size: 17px; margin: 0 0 6px; }
    .job-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); }
    .job-text { white-space: pre-wrap; margin: 0; line-height: 1.6; }
    .job-section { margin-top: 20px; }
    .job-section h3 { font-size: 15px; margin: 0 0 8px; }
    .apply-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .apply-grid .full { grid-column: 1 / -1; }
    /* Pyèj pou robo: moun pa wè chan sa a, robo yo ranpli l. */
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .careers-foot { margin-top: 40px; font-size: 12.5px; color: var(--muted); text-align: center; }
    .form-section { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--line); }
    .form-section:first-of-type { margin-top: 8px; padding-top: 0; border-top: 0; }
    .form-section h3 { font-size: 15.5px; margin: 0 0 14px; }
    .req { color: #e5484d; margin-left: 3px; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px 18px; padding-top: 4px; }
    .choices label { display: flex; align-items: center; gap: 7px; font-weight: 400; cursor: pointer; }
    .field.has-error .input, .field.has-error .textarea, .field.has-error .select { border-color: #e5484d; }
  </style>
</head>
<body>
  <main class="careers">
    <div id="content"><p class="loading">Ap chaje…</p></div>
    <p class="careers-foot">Fèt ak KONMBIT</p>
  </main>

  <script src="api.js"></script>
  <script>
  (function () {
    'use strict';
    const { api, h, ApiError } = Konbit;

    const content = document.getElementById('content');
    const params = new URLSearchParams(location.search);
    const orgSlug = (params.get('org') || '').trim().toLowerCase();
    const jobSlug = (params.get('job') || '').trim().toLowerCase();
    const source = (params.get('src') || 'paj karyè').slice(0, 100);

    const EMPLOYMENT_TYPE_LABELS = {
      full_time: 'Tan plen', part_time: 'Tan pasyèl', contract: 'Kontra',
      intern: 'Estaj', seasonal: 'Sezon',
    };

    // -------------------------------------------------------------------
    // ZOUTI
    // -------------------------------------------------------------------

    // Tout rekèt isit yo san koneksyon: yon kandida pa gen kont.
    const PUBLIC = { auth: false };

    function errorMessage(err) {
      let msg = err instanceof ApiError ? err.message : 'Yon bagay pa mache.';
      if (err && err.fields && err.fields.length) {
        msg += ' ' + err.fields.map((f) => `${f.field}: ${f.message}`).join('; ');
      }
      return msg;
    }

    function showError(text) {
      content.replaceChildren(h('div', { class: 'alert alert-error' }, text));
    }

    function listUrl() {
      return `careers.html?org=${encodeURIComponent(orgSlug)}`;
    }

    function jobUrl(slug) {
      return `${listUrl()}&job=${encodeURIComponent(slug)}`;
    }

    // "21 oktòb 2026" — fmt nan api.js ekri dat yo an kreyòl.
    const formatDay = (value) => (value ? Konbit.fmt.date(value) : '');

    function isHttpUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === 'https:' || u.protocol === 'http:';
      } catch {
        return false;
      }
    }

    /** "25 000 – 35 000 HTG / mwa", oswa null si biznis la pa montre salè a. */
    function salaryText(job) {
      const { salary_min: lo, salary_max: hi, currency } = job;
      if (!lo && !hi) return null;
      const cur = currency || 'HTG';
      const num = (c) => Konbit.fmt.money(c, cur).replace(/,00(?=\s)/, '');
      if (lo && hi && lo !== hi) return `${num(lo).replace(` ${cur}`, '')} – ${num(hi)} / mwa`;
      if (lo && !hi) return `Apati ${num(lo)} / mwa`;
      if (!lo && hi) return `Jiska ${num(hi)} / mwa`;
      return `${num(lo)} / mwa`;
    }

    function metaLine(job) {
      const salary = salaryText(job);
      return h('div', { class: 'job-meta' },
        salary ? h('span', { style: 'font-weight: 600; color: var(--text);' }, salary) : null,
        h('span', {}, EMPLOYMENT_TYPE_LABELS[job.employment_type] || job.employment_type),
        job.location ? h('span', {}, job.is_remote ? `${job.location} · adistans` : job.location)
                     : (job.is_remote ? h('span', {}, 'Adistans') : null),
        job.openings > 1 ? h('span', {}, `${job.openings} pòs`) : null,
        job.closes_at ? h('span', {}, `Aplike avan ${formatDay(job.closes_at)}`) : null,
      );
    }

    function header(companyName, title) {
      document.title = `${title} — ${companyName}`;
      return h('div', { class: 'careers-head' },
        h('p', { class: 'company' }, companyName),
        h('h1', {}, title),
      );
    }

    // -------------------------------------------------------------------
    // LIS ÒF YO
    // -------------------------------------------------------------------

    async function renderList() {
      let data;
      try {
        data = await api.get(`/api/jobs/public/${encodeURIComponent(orgSlug)}`, PUBLIC);
      } catch (err) {
        showError(err instanceof ApiError && err.status === 404
          ? 'Nou pa jwenn biznis sa a. Verifye lyen an.'
          : errorMessage(err));
        return;
      }

      const search = h('input', {
        class: 'input', type: 'search', id: 'q',
        placeholder: 'Chèche yon pòs', 'aria-label': 'Chèche yon pòs',
      });
      const list = h('div', { class: 'job-list' });

      function draw() {
        const q = search.value.trim().toLowerCase();
        const items = data.items.filter((j) => !q || j.title.toLowerCase().includes(q));
        if (!items.length) {
          list.replaceChildren(h('p', { class: 'empty' },
            data.items.length ? 'Pa gen pòs ki koresponn ak rechèch la.'
                              : 'Pa gen okenn pòs louvri kounye a. Tounen pita.'));
          return;
        }
        list.replaceChildren(...items.map((job) =>
          h('a', { class: 'job-item', href: jobUrl(job.slug) },
            h('h2', {}, job.title),
            metaLine(job),
          )));
      }

      search.addEventListener('input', draw);
      draw();

      content.replaceChildren(
        header(data.company_name, 'Travay disponib'),
        data.items.length > 5 ? h('div', { style: 'margin-bottom: 16px;' }, search) : null,
        list,
      );
    }

    // -------------------------------------------------------------------
    // DETAY AK FÒM APLIKASYON
    // -------------------------------------------------------------------

    function textSection(title, text) {
      if (!text || !text.trim()) return null;
      return h('div', { class: 'job-section' },
        h('h3', {}, title),
        h('p', { class: 'job-text' }, text),
      );
    }

    function field(label, inputEl, hint, extraClass) {
      return h('div', { class: `field ${extraClass || ''}` },
        h('label', { for: inputEl.id }, label),
        inputEl,
        hint ? h('span', { class: 'hint' }, hint) : null,
      );
    }

    // --- Kesyon dinamik yo -------------------------------------------------

    /**
     * Bati kontwòl pou yon kesyon dapre kalite l. Retounen { el, read, focus }:
     * `read()` bay repons lan nan fòma backend la atann (oswa null si vid).
     */
    function questionControl(q) {
      const id = `q-${q.id}`;
      const name = `q-${q.id}`;

      if (q.question_type === 'yes_no') {
        const yes = h('input', { type: 'radio', name, value: 'true', id: `${id}-wi` });
        const no = h('input', { type: 'radio', name, value: 'false', id: `${id}-non` });
        return {
          el: h('div', { class: 'choices', role: 'radiogroup' },
            h('label', { for: yes.id }, yes, 'Wi'),
            h('label', { for: no.id }, no, 'Non')),
          read: () => (yes.checked ? true : no.checked ? false : null),
          focus: () => yes.focus(),
          inputs: [yes, no],
        };
      }

      if (q.question_type === 'single_choice' && (q.options || []).length <= 4) {
        const radios = q.options.map((opt, i) =>
          h('input', { type: 'radio', name, value: opt, id: `${id}-${i}` }));
        return {
          el: h('div', { class: 'choices', role: 'radiogroup' },
            ...radios.map((r, i) => h('label', { for: r.id }, r, q.options[i]))),
          read: () => (radios.find((r) => r.checked) || {}).value || null,
          focus: () => radios[0].focus(),
          inputs: radios,
        };
      }

      if (q.question_type === 'single_choice') {
        const sel = h('select', { class: 'select', id },
          h('option', { value: '' }, 'Chwazi…'),
          ...q.options.map((opt) => h('option', { value: opt }, opt)));
        return { el: sel, read: () => sel.value || null, focus: () => sel.focus(), inputs: [sel] };
      }

      if (q.question_type === 'multi_choice') {
        const boxes = q.options.map((opt, i) =>
          h('input', { type: 'checkbox', name, value: opt, id: `${id}-${i}` }));
        return {
          el: h('div', { class: 'choices' },
            ...boxes.map((b, i) => h('label', { for: b.id }, b, q.options[i]))),
          read: () => {
            const picked = boxes.filter((b) => b.checked).map((b) => b.value);
            return picked.length ? picked : null;
          },
          focus: () => boxes[0].focus(),
          inputs: boxes,
        };
      }

      if (q.question_type === 'long_text') {
        const ta = h('textarea', { class: 'textarea', id, rows: '4', maxlength: '5000' });
        return { el: ta, read: () => ta.value.trim() || null, focus: () => ta.focus(), inputs: [ta] };
      }

      const attrs = {
        short_text: { type: 'text', maxlength: '300' },
        number: { type: 'number', min: '0', step: 'any', inputmode: 'decimal' },
        date: { type: 'date' },
        url: { type: 'url', maxlength: '500', placeholder: 'https://…' },
      }[q.question_type] || { type: 'text' };
      const inp = h('input', { class: 'input', id, autocomplete: 'off', ...attrs });
      return {
        el: inp,
        read: () => {
          const v = inp.value.trim();
          if (!v) return null;
          return q.question_type === 'number' ? Number(v) : v;
        },
        focus: () => inp.focus(),
        inputs: [inp],
      };
    }

    function labelFor(q, control) {
      const forId = control.el.tagName === 'DIV' ? undefined : control.el.id;
      return h('label', forId ? { for: forId } : {},
        q.label,
        q.is_required ? h('span', { class: 'req', 'aria-hidden': 'true' }, '*') : null);
    }

    // --- Fòm nan --------------------------------------------------------------

    function applyForm(job, questionData) {
      const name = h('input', { class: 'input', id: 'a-name', autocomplete: 'name', maxlength: '200', required: true });
      const email = h('input', { class: 'input', id: 'a-email', type: 'email', autocomplete: 'email', required: true });
      const phone = h('input', { class: 'input', id: 'a-phone', type: 'tel', autocomplete: 'tel', maxlength: '50' });
      const cv = h('input', { class: 'input', id: 'a-cv', type: 'url', maxlength: '500', placeholder: 'https://…' });
      const letter = h('textarea', { class: 'textarea', id: 'a-letter', rows: '6', maxlength: '5000' });
      const trap = h('input', { id: 'a-website', type: 'text', tabindex: '-1', autocomplete: 'off' });

      const msg = h('div', { class: 'alert alert-error', role: 'alert', hidden: true });
      const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, 'Voye aplikasyon an');

      const req = () => h('span', { class: 'req', 'aria-hidden': 'true' }, '*');

      // Kesyon yo, gwoupe pa seksyon nan lòd backend la bay
      const questions = questionData.items;
      const byId = new Map(questions.map((q) => [q.id, q]));
      const entries = questions.map((q) => {
        const control = questionControl(q);
        const wrap = h('div', { class: `field ${q.question_type === 'long_text' ? 'full' : ''}` },
          labelFor(q, control),
          control.el,
          q.help_text ? h('span', { class: 'hint' }, q.help_text) : null);
        return { q, control, wrap };
      });
      const entryById = new Map(entries.map((e) => [e.q.id, e]));

      const sectionEls = questionData.sections.map((sec) => {
        const own = entries.filter((e) => e.q.section === sec.key);
        if (!own.length) return null;
        return h('div', { class: 'form-section' },
          h('h3', {}, sec.label),
          h('div', { class: 'apply-grid' }, ...own.map((e) => e.wrap)));
      });

      /** Yon kesyon vizib si li pa gen kondisyon, oswa si repons paran an koresponn. */
      function isVisible(q) {
        if (q.condition_question_id == null) return true;
        const parent = entryById.get(q.condition_question_id);
        if (!parent || !isVisible(parent.q)) return false;
        const v = parent.control.read();
        if (v === null) return false;
        return (typeof v === 'boolean' ? String(v) : String(v)) === q.condition_value;
      }

      function syncVisibility() {
        for (const e of entries) e.wrap.hidden = !isVisible(e.q);
      }

      const form = h('form', { novalidate: true },
        h('div', { class: 'form-section' },
          h('h3', {}, 'Kontak ou'),
          h('div', { class: 'apply-grid' },
            h('div', { class: 'field' }, h('label', { for: name.id }, 'Non konplè', req()), name),
            h('div', { class: 'field' }, h('label', { for: email.id }, 'Imel', req()), email),
            h('div', { class: 'field' }, h('label', { for: phone.id }, 'Telefòn'), phone),
          )),
        ...sectionEls,
        h('div', { class: 'form-section' },
          h('h3', {}, 'CV ak lèt motivasyon'),
          h('div', { class: 'apply-grid' },
            field('Lyen CV ou', cv, 'Google Drive, Dropbox, LinkedIn… Asire w lyen an louvri pou tout moun.'),
            field('Poukisa pòs sa a enterese w?', letter, 'Opsyonèl.', 'full'),
          )),
        h('div', { class: 'hp', 'aria-hidden': 'true' },
          h('label', { for: trap.id }, 'Pa ranpli chan sa a'), trap),
        h('p', { class: 'hint', style: 'display: block; margin-top: 18px;' },
          h('span', { class: 'req' }, '*'), ' Obligatwa'),
        msg,
        h('div', { class: 'form-actions' }, submit),
      );

      form.addEventListener('change', syncVisibility);
      syncVisibility();

      function fail(text) {
        msg.textContent = text;
        msg.hidden = false;
        msg.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.hidden = true;
        for (const en of entries) en.wrap.classList.remove('has-error');

        const fullName = name.value.trim();
        const mail = email.value.trim();
        const cvUrl = cv.value.trim();

        if (fullName.length < 2) { fail('Mete non konplè ou.'); name.focus(); return; }
        if (!email.checkValidity() || !mail) { fail('Mete yon imel valab.'); email.focus(); return; }

        // Repons yo: sèlman kesyon ki vizib yo
        const answers = {};
        const missing = [];
        for (const en of entries) {
          if (!isVisible(en.q)) continue;
          const v = en.control.read();
          if (v === null) {
            if (en.q.is_required) missing.push(en);
            continue;
          }
          answers[String(en.q.id)] = v;
        }
        if (missing.length) {
          for (const en of missing) en.wrap.classList.add('has-error');
          fail(`Reponn kesyon obligatwa yo: ${missing.map((en) => en.q.label).join(' · ')}`);
          missing[0].control.focus();
          return;
        }

        if (cvUrl && !isHttpUrl(cvUrl)) {
          fail('Lyen CV a dwe kòmanse ak https://');
          cv.focus();
          return;
        }

        // Yon robo ranpli chan kache a: nou fè kòm si tout bagay pase.
        if (trap.value) { showReceipt(job, null); return; }

        submit.disabled = true;
        submit.textContent = 'Ap voye…';
        try {
          const receipt = await api.post(
            `/api/applications/public/${encodeURIComponent(orgSlug)}/${encodeURIComponent(job.slug)}`,
            {
              full_name: fullName,
              email: mail,
              phone: phone.value.trim() || null,
              resume_url: cvUrl || null,
              cover_letter: letter.value.trim() || null,
              source,
              answers,
            },
            PUBLIC,
          );
          showReceipt(job, receipt);
        } catch (err) {
          fail(errorMessage(err));
          submit.disabled = false;
          submit.textContent = 'Voye aplikasyon an';
        }
      });

      return h('section', { class: 'panel', style: 'margin-top: 28px;' },
        h('div', { class: 'panel-head' }, h('h2', {}, 'Aplike pou pòs sa a')),
        form,
      );
    }

    function showReceipt(job, receipt) {
      document.title = `Aplikasyon voye — ${job.company_name || ''}`;
      content.replaceChildren(
        header(job.company_name || '', 'Mèsi!'),
        h('section', { class: 'panel' },
          h('p', { style: 'margin: 0 0 10px; font-weight: 600;' },
            `Aplikasyon w pou "${job.title}" rive.`),
          h('p', { style: 'margin: 0;' },
            receipt ? receipt.message
                    : 'Ekip la ap gade l epi n ap kontakte w si pwofil ou koresponn ak pozisyon an.'),
        ),
        h('p', { style: 'margin-top: 20px;' },
          h('a', { class: 'plain-link', href: listUrl() }, 'Wè lòt pòs yo')),
      );
      window.scrollTo(0, 0);
    }

    async function renderJob() {
      let job;
      let questionData;
      try {
        const base = `${encodeURIComponent(orgSlug)}/${encodeURIComponent(jobSlug)}`;
        [job, questionData] = await Promise.all([
          api.get(`/api/jobs/public/${base}`, PUBLIC),
          api.get(`/api/application-questions/public/${base}`, PUBLIC),
        ]);
      } catch (err) {
        if (err instanceof ApiError && err.status === 404) {
          content.replaceChildren(
            h('div', { class: 'alert alert-error' }, 'Pòs sa a pa disponib ankò. Li ka fèmen.'),
            h('p', { style: 'margin-top: 16px;' },
              h('a', { class: 'plain-link', href: listUrl() }, 'Wè pòs ki louvri yo')),
          );
        } else {
          showError(errorMessage(err));
        }
        return;
      }

      content.replaceChildren(
        h('a', { class: 'back-link', href: listUrl() }, 'Tout pòs yo'),
        header(job.company_name || '', job.title),
        metaLine(job),
        textSection('Deskripsyon', job.description),
        textSection('Responsablite', job.responsibilities),
        textSection('Kalifikasyon', job.requirements),
        applyForm(job, questionData),
      );
    }

    // -------------------------------------------------------------------
    // DEMARAJ
    // -------------------------------------------------------------------

    if (!/^[a-z0-9-]+$/.test(orgSlug)) {
      showError('Lyen sa a pa konplè. Mande biznis la lyen paj karyè li.');
      return;
    }

    if (jobSlug) {
      renderJob();
    } else {
      renderList();
    }
  })();
  </script>
</body>
</html>
