<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Karyè — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    /* Paj piblik: pa gen meni HR, jis yon kolòn santre. */
    .careers {
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 20px 64px;
    }
    .careers-head { margin-bottom: 24px; }
    .careers-head .company { font-size: 14px; color: var(--muted); margin: 0 0 4px; }
    .careers-head h1 { margin: 0; }
    .job-list { display: grid; gap: 12px; }
    .job-item {
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      color: inherit;
      text-decoration: none;
    }
    .job-item:hover, .job-item:focus-visible { border-color: currentColor; }
    .job-item h2 { font-size: 17px; margin: 0 0 6px; }
    .job-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); }
    .job-text { white-space: pre-wrap; margin: 0; line-height: 1.6; }
    .job-section { margin-top: 20px; }
    .job-section h3 { font-size: 15px; margin: 0 0 8px; }
    .apply-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    .apply-grid .full { grid-column: 1 / -1; }
    /* Pyèj pou robo: moun pa wè chan sa a, robo yo ranpli l. */
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
    .careers-foot { margin-top: 40px; font-size: 12.5px; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main class="careers">
    <div id="content"><p class="loading">Ap chaje…</p></div>
    <p class="careers-foot">Fèt ak KONMBIT</p>
  </main>

  <script src="api.js"></script>
  <script>
  (function () {
    'use strict';
    const { api, h, ApiError } = Konbit;

    const content = document.getElementById('content');
    const params = new URLSearchParams(location.search);
    const orgSlug = (params.get('org') || '').trim().toLowerCase();
    const jobSlug = (params.get('job') || '').trim().toLowerCase();
    const source = (params.get('src') || 'paj karyè').slice(0, 100);

    const EMPLOYMENT_TYPE_LABELS = {
      full_time: 'Tan plen', part_time: 'Tan pasyèl', contract: 'Kontra',
      intern: 'Estaj', seasonal: 'Sezon',
    };

    // -------------------------------------------------------------------
    // ZOUTI
    // -------------------------------------------------------------------

    // Tout rekèt isit yo san koneksyon: yon kandida pa gen kont.
    const PUBLIC = { auth: false };

    function errorMessage(err) {
      let msg = err instanceof ApiError ? err.message : 'Yon bagay pa mache.';
      if (err && err.fields && err.fields.length) {
        msg += ' ' + err.fields.map((f) => `${f.field}: ${f.message}`).join('; ');
      }
      return msg;
    }

    function showError(text) {
      content.replaceChildren(h('div', { class: 'alert alert-error' }, text));
    }

    function listUrl() {
      return `careers.html?org=${encodeURIComponent(orgSlug)}`;
    }

    function jobUrl(slug) {
      return `${listUrl()}&job=${encodeURIComponent(slug)}`;
    }

    // "21 oktòb 2026" — fmt nan api.js ekri dat yo an kreyòl.
    const formatDay = (value) => (value ? Konbit.fmt.date(value) : '');

    function isHttpUrl(value) {
      try {
        const u = new URL(value);
        return u.protocol === 'https:' || u.protocol === 'http:';
      } catch {
        return false;
      }
    }

    function metaLine(job) {
      return h('div', { class: 'job-meta' },
        h('span', {}, EMPLOYMENT_TYPE_LABELS[job.employment_type] || job.employment_type),
        job.location ? h('span', {}, job.is_remote ? `${job.location} · adistans` : job.location)
                     : (job.is_remote ? h('span', {}, 'Adistans') : null),
        job.openings > 1 ? h('span', {}, `${job.openings} pòs`) : null,
        job.closes_at ? h('span', {}, `Aplike avan ${formatDay(job.closes_at)}`) : null,
      );
    }

    function header(companyName, title) {
      document.title = `${title} — ${companyName}`;
      return h('div', { class: 'careers-head' },
        h('p', { class: 'company' }, companyName),
        h('h1', {}, title),
      );
    }

    // -------------------------------------------------------------------
    // LIS ÒF YO
    // -------------------------------------------------------------------

    async function renderList() {
      let data;
      try {
        data = await api.get(`/api/jobs/public/${encodeURIComponent(orgSlug)}`, PUBLIC);
      } catch (err) {
        showError(err instanceof ApiError && err.status === 404
          ? 'Nou pa jwenn biznis sa a. Verifye lyen an.'
          : errorMessage(err));
        return;
      }

      const search = h('input', {
        class: 'input', type: 'search', id: 'q',
        placeholder: 'Chèche yon pòs', 'aria-label': 'Chèche yon pòs',
      });
      const list = h('div', { class: 'job-list' });

      function draw() {
        const q = search.value.trim().toLowerCase();
        const items = data.items.filter((j) => !q || j.title.toLowerCase().includes(q));
        if (!items.length) {
          list.replaceChildren(h('p', { class: 'empty' },
            data.items.length ? 'Pa gen pòs ki koresponn ak rechèch la.'
                              : 'Pa gen okenn pòs louvri kounye a. Tounen pita.'));
          return;
        }
        list.replaceChildren(...items.map((job) =>
          h('a', { class: 'job-item', href: jobUrl(job.slug) },
            h('h2', {}, job.title),
            metaLine(job),
          )));
      }

      search.addEventListener('input', draw);
      draw();

      content.replaceChildren(
        header(data.company_name, 'Travay disponib'),
        data.items.length > 5 ? h('div', { style: 'margin-bottom: 16px;' }, search) : null,
        list,
      );
    }

    // -------------------------------------------------------------------
    // DETAY AK FÒM APLIKASYON
    // -------------------------------------------------------------------

    function textSection(title, text) {
      if (!text || !text.trim()) return null;
      return h('div', { class: 'job-section' },
        h('h3', {}, title),
        h('p', { class: 'job-text' }, text),
      );
    }

    function field(label, inputEl, hint, extraClass) {
      return h('div', { class: `field ${extraClass || ''}` },
        h('label', { for: inputEl.id }, label),
        inputEl,
        hint ? h('span', { class: 'hint' }, hint) : null,
      );
    }

    function applyForm(job) {
      const name = h('input', { class: 'input', id: 'a-name', autocomplete: 'name', maxlength: '200', required: true });
      const email = h('input', { class: 'input', id: 'a-email', type: 'email', autocomplete: 'email', required: true });
      const phone = h('input', { class: 'input', id: 'a-phone', type: 'tel', autocomplete: 'tel', maxlength: '50' });
      const cv = h('input', { class: 'input', id: 'a-cv', type: 'url', maxlength: '500', placeholder: 'https://…' });
      const letter = h('textarea', { class: 'textarea', id: 'a-letter', rows: '6', maxlength: '5000' });
      const trap = h('input', { id: 'a-website', type: 'text', tabindex: '-1', autocomplete: 'off' });

      const msg = h('div', { class: 'alert alert-error', role: 'alert', hidden: true });
      const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, 'Voye aplikasyon an');

      const form = h('form', { novalidate: true },
        h('div', { class: 'apply-grid' },
          field('Non konplè', name),
          field('Imel', email),
          field('Telefòn', phone, 'Opsyonèl.'),
          field('Lyen CV ou', cv, 'Google Drive, Dropbox, LinkedIn… Asire w lyen an louvri pou tout moun.'),
          field('Poukisa pòs sa a enterese w?', letter, 'Opsyonèl.', 'full'),
        ),
        h('div', { class: 'hp', 'aria-hidden': 'true' },
          h('label', { for: trap.id }, 'Pa ranpli chan sa a'), trap),
        msg,
        h('div', { class: 'form-actions' }, submit),
      );

      function fail(text) {
        msg.textContent = text;
        msg.hidden = false;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.hidden = true;

        const fullName = name.value.trim();
        const mail = email.value.trim();
        const cvUrl = cv.value.trim();

        if (fullName.length < 2) { fail('Mete non konplè ou.'); name.focus(); return; }
        if (!email.checkValidity() || !mail) { fail('Mete yon imel valab.'); email.focus(); return; }
        if (cvUrl && !isHttpUrl(cvUrl)) {
          fail('Lyen CV a dwe kòmanse ak https://');
          cv.focus();
          return;
        }

        // Yon robo ranpli chan kache a: nou fè kòm si tout bagay pase.
        if (trap.value) { showReceipt(job, null); return; }

        submit.disabled = true;
        submit.textContent = 'Ap voye…';
        try {
          const receipt = await api.post(
            `/api/applications/public/${encodeURIComponent(orgSlug)}/${encodeURIComponent(job.slug)}`,
            {
              full_name: fullName,
              email: mail,
              phone: phone.value.trim() || null,
              resume_url: cvUrl || null,
              cover_letter: letter.value.trim() || null,
              source,
            },
            PUBLIC,
          );
          showReceipt(job, receipt);
        } catch (err) {
          fail(errorMessage(err));
          submit.disabled = false;
          submit.textContent = 'Voye aplikasyon an';
        }
      });

      return h('section', { class: 'panel', style: 'margin-top: 28px;' },
        h('div', { class: 'panel-head' }, h('h2', {}, 'Aplike pou pòs sa a')),
        form,
      );
    }

    function showReceipt(job, receipt) {
      document.title = `Aplikasyon voye — ${job.company_name || ''}`;
      content.replaceChildren(
        header(job.company_name || '', 'Mèsi!'),
        h('section', { class: 'panel' },
          h('p', { style: 'margin: 0 0 10px; font-weight: 600;' },
            `Aplikasyon w pou "${job.title}" rive.`),
          h('p', { style: 'margin: 0;' },
            receipt ? receipt.message
                    : 'Ekip la ap gade l epi n ap kontakte w si pwofil ou koresponn ak pozisyon an.'),
        ),
        h('p', { style: 'margin-top: 20px;' },
          h('a', { class: 'plain-link', href: listUrl() }, 'Wè lòt pòs yo')),
      );
      window.scrollTo(0, 0);
    }

    async function renderJob() {
      let job;
      try {
        job = await api.get(
          `/api/jobs/public/${encodeURIComponent(orgSlug)}/${encodeURIComponent(jobSlug)}`, PUBLIC);
      } catch (err) {
        if (err instanceof ApiError && err.status === 404) {
          content.replaceChildren(
            h('div', { class: 'alert alert-error' }, 'Pòs sa a pa disponib ankò. Li ka fèmen.'),
            h('p', { style: 'margin-top: 16px;' },
              h('a', { class: 'plain-link', href: listUrl() }, 'Wè pòs ki louvri yo')),
          );
        } else {
          showError(errorMessage(err));
        }
        return;
      }

      content.replaceChildren(
        h('a', { class: 'back-link', href: listUrl() }, 'Tout pòs yo'),
        header(job.company_name || '', job.title),
        metaLine(job),
        textSection('Deskripsyon', job.description),
        textSection('Responsablite', job.responsibilities),
        textSection('Kalifikasyon', job.requirements),
        applyForm(job),
      );
    }

    // -------------------------------------------------------------------
    // DEMARAJ
    // -------------------------------------------------------------------

    if (!/^[a-z0-9-]+$/.test(orgSlug)) {
      showError('Lyen sa a pa konplè. Mande biznis la lyen paj karyè li.');
      return;
    }

    if (jobSlug) {
      renderJob();
    } else {
      renderList();
    }
  })();
  </script>
</body>
</html>
