<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title data-i18n>Nouvo modpas — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    .pw-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    .pw-card { width: 100%; max-width: 440px; }
    .pw-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 28px; }
    .pw-card .form-actions, .pw-card .pw-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main class="pw-page">
    <div class="pw-card panel">
      <div class="pw-top">
        <a class="brand" href="index.html" data-i18n-attr="aria-label" aria-label="KONMBIT — akèy">
          <span class="brand-mark" aria-hidden="true">K</span>
          <span class="brand-name">KONMBIT</span>
        </a>
        <div id="lang-slot"></div>
      </div>

      <h1 style="font-size: 22px; font-weight: 700;" data-i18n>Chwazi yon nouvo modpas</h1>

      <form class="auth-form" id="rp-form" novalidate hidden>
        <div class="alert alert-error" id="rp-error" role="alert"></div>

        <div class="field">
          <label for="rp-new" data-i18n>Nouvo modpas</label>
          <input class="input" id="rp-new" type="password" autocomplete="new-password"
                 minlength="10" required aria-describedby="rp-hint">
          <span class="hint" id="rp-hint" data-i18n>Omwen 10 karaktè, ak lèt ak chif.</span>
        </div>
        <div class="field">
          <label for="rp-confirm" data-i18n>Konfime nouvo modpas la</label>
          <input class="input" id="rp-confirm" type="password" autocomplete="new-password" required>
        </div>

        <button class="btn btn-primary" type="submit" id="rp-submit" data-i18n>Anrejistre nouvo modpas la</button>
      </form>

      <div id="rp-done" hidden>
        <div class="alert alert-ok" role="status" data-i18n>Modpas ou chanje. Ou ka konekte kounye a.</div>
        <div class="pw-actions">
          <a class="btn btn-primary" href="login.html" data-i18n>Konekte</a>
        </div>
      </div>

      <div id="rp-bad" hidden>
        <div class="alert alert-error" id="rp-bad-text" role="alert"></div>
        <div class="pw-actions">
          <a class="btn btn-ghost" href="login.html#bliye" data-i18n>Mande yon lòt lyen</a>
        </div>
      </div>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, ApiError, i18n, t } = Konbit;

    await i18n.ready;
    document.getElementById('lang-slot').append(i18n.switcher());

    const $ = (id) => document.getElementById(id);

    // Token an apre "#" (navigatè a pa janm voye l bay sèvè a). Nou li l,
    // epi nou retire l nan URL la: li pa rete nan istwa navigatè a.
    const token = decodeURIComponent(location.hash.slice(1));
    if (location.hash) history.replaceState(null, '', location.pathname + location.search);

    function showBad(text) {
      $('rp-form').hidden = true;
      $('rp-bad-text').textContent = text;
      $('rp-bad').hidden = false;
    }

    if (!/^[A-Za-z0-9_-]{20,200}$/.test(token)) {
      showBad(t('Lyen sa a pa konplè. Mande yon lòt nan paj koneksyon an.'));
      return;
    }

    $('rp-form').hidden = false;
    $('rp-new').focus();

    $('rp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = $('rp-error');
      error.textContent = '';

      const next = $('rp-new').value;
      const confirm = $('rp-confirm').value;
      if (!next || !confirm) {
        error.textContent = t('Ranpli tout chan ki obligatwa yo.');
        return;
      }
      if (next.length < 10 || !/\d/.test(next) || !/[a-zA-Z]/.test(next)) {
        error.textContent = t('Modpas la dwe gen omwen 10 karaktè, ak lèt ak chif.');
        return;
      }
      if (next !== confirm) {
        error.textContent = t('De modpas yo pa menm.');
        return;
      }

      const btn = $('rp-submit');
      btn.disabled = true;
      btn.textContent = t('Yon ti moman…');
      try {
        await api.post('/api/auth/reset-password', { token, new_password: next }, { auth: false });
        // Tout ansyen sesyon yo anile sou sèvè a: efase token ki rete nan navigatè sa a.
        try {
          localStorage.removeItem('konbit.access_token');
          localStorage.removeItem('konbit.refresh_token');
        } catch { /* navigasyon prive: pa grav */ }
        $('rp-form').hidden = true;
        $('rp-done').hidden = false;
      } catch (err) {
        if (err instanceof ApiError && err.status === 400) {
          showBad(err.message);           // lyen ekspire oswa deja sèvi (tradui pa backend la)
          return;
        }
        error.textContent = err instanceof ApiError ? err.message : t('Yon bagay pa mache. Eseye ankò.');
        btn.disabled = false;
        btn.textContent = t('Anrejistre nouvo modpas la');
      }
    });
  })();
  </script>
</body>
</html>
