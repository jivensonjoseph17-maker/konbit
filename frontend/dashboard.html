<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Tablo de bò — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    /* --- Kat chif anlè yo --- */
    .dash-kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; min-width: 0; }
    .kpi .k-label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .kpi .k-value { font-size: 26px; font-weight: 800; margin-top: 6px; line-height: 1.1;
      font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi .k-sub { font-size: 12.5px; color: var(--muted); margin-top: 4px; min-height: 1em;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .kpi .k-sub.warn { color: #b45309; }
    @media (max-width: 1000px) { .dash-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .dash-note { margin: -4px 0 18px; padding: 12px 16px; border-radius: 12px; font-size: 14px;
      background: var(--surface-2, rgba(37, 99, 235, 0.06)); color: var(--muted); }

    /* --- Prezans: yon ba konpak, pa yon gwo kat --- */
    .clockbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .clockbar .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--line-strong, #cbd5e1); }
    .clockbar.is-on .dot { background: #16a34a; box-shadow: 0 0 0 6px rgba(22, 163, 74, 0.15); }
    .clockbar .c-main { flex: 1; min-width: 180px; }
    .clockbar .c-label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .clockbar .c-timer { font-size: 28px; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.2; }
    .clockbar .c-since { font-size: 13px; color: var(--muted); }
    .clockbar .c-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* --- Orè: 7 jou --- */
    .week-strip { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
    .day { border: 1px solid var(--line); border-radius: 12px; padding: 10px 6px; text-align: center; min-width: 0; }
    .day .dn { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    .day .dd { font-size: 19px; font-weight: 800; margin-top: 2px; }
    .day .dt { font-size: 12px; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .day.is-off { background: var(--surface-2, rgba(148, 163, 184, 0.1)); color: var(--muted); }
    .day.is-today { border-color: var(--accent, #2563eb); box-shadow: inset 0 0 0 1px var(--accent, #2563eb); }
    @media (max-width: 640px) {
      .week-strip { gap: 4px; }
      .day { padding: 8px 2px; }
      .day .dt { font-size: 10.5px; }
    }

    .panel-head .btn { margin-inline-start: auto; }

    /* --- Layout: seksyon yo agoch, ekip / fòmasyon adwat --- */
    .dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
    .dash-side { display: grid; gap: 18px; }
    @media (max-width: 1100px) { .dash-grid { grid-template-columns: minmax(0, 1fr); } }

    /* --- Ba bouton seksyon yo --- */
    .dash-tabs {
      display: flex; gap: 6px; padding: 6px; margin-bottom: 18px; overflow-x: auto;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      scrollbar-width: none;
    }
    .dash-tabs::-webkit-scrollbar { display: none; }
    .dash-tab {
      display: inline-flex; align-items: center; gap: 8px; flex: none;
      padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
      background: transparent; color: var(--muted); font: inherit; font-size: 14.5px; font-weight: 600;
      white-space: nowrap; transition: background .15s, color .15s;
    }
    .dash-tab svg { width: 18px; height: 18px; flex: none; }
    .dash-tab:hover { color: var(--text); background: var(--surface-2, rgba(148, 163, 184, 0.12)); }
    .dash-tab[aria-selected="true"] { background: var(--accent, #2563eb); color: #fff; }
    .dash-tab:focus-visible { outline: 2px solid var(--accent, #2563eb); outline-offset: 2px; }
    .tab-panel { display: grid; gap: 18px; }
    #col-main { display: grid; gap: 18px; align-content: start; }

    /* --- Tablo pwentaj yo --- */
    .entries td, .entries th { white-space: nowrap; }
    .entries .num { font-variant-numeric: tabular-nums; }
    .period-line { color: var(--muted); font-size: 14px; margin: 0 0 12px; }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="page-head">
          <h1 id="greeting"></h1>
          <p id="today-label"></p>
        </div>

        <div id="top"></div>

        <div class="dash-grid">
          <div id="col-main"></div>
          <div class="dash-side" id="col-side"></div>
        </div>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script>
  (function () {
    'use strict';
    const { api, fmt, h, ApiError, shell, t } = Konbit;

    const top = document.getElementById('top');
    const colMain = document.getElementById('col-main');
    const colSide = document.getElementById('col-side');

    // -----------------------------------------------------------------------
    // ZOUTI
    // -----------------------------------------------------------------------

    function panel(title, action) {
      const body = h('div', {}, h('p', { class: 'loading' }, t('Ap chaje…')));
      const el = h('section', { class: 'panel' },
        h('div', { class: 'panel-head' }, h('h2', {}, title), action || null),
        body,
      );
      return { el, body };
    }

    function fill(container, ...nodes) {
      container.replaceChildren(...nodes.flat().filter(Boolean));
    }

    function errorText(err) {
      return err instanceof ApiError ? err.message : t('Nou pa t ka chaje seksyon sa a.');
    }

    function initials(name) {
      return (name || '?')
        .split(/\s+/).filter(Boolean).slice(0, 2)
        .map((p) => p[0].toUpperCase()).join('');
    }

    const pad2 = (n) => String(n).padStart(2, '0');
    const isoDate = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    const hhmm = (v) => (v || '').slice(0, 5);

    function moneyRow(label, value, cur) {
      return h('div', { class: 'row' }, h('span', { class: 'k' }, label), h('span', {}, fmt.money(value, cur)));
    }

    function minusRow(label, value, cur) {
      return value
        ? h('div', { class: 'row minus' }, h('span', { class: 'k' }, label), h('span', { class: 'v' }, `−${fmt.money(value, cur)}`))
        : null;
    }

    /** Non ofisyèl yo (ONA, OFATMA, CFGDCT, FDU / CAS) pa tradui. */
    function deductionRows(s, cur) {
      return [
        minusRow(t('Enpo sou salè (IRI)'), s.tax_amount, cur),
        minusRow(t('Retni sou bonis / èdtan siplemantè'), s.supplemental_tax_amount, cur),
        minusRow('ONA', s.ona_amount, cur),
        minusRow('OFATMA', s.ofatma_amount, cur),
        minusRow('CFGDCT', s.cfgdct_amount, cur),
        minusRow('FDU / CAS', s.fdu_cas_amount, cur),
        minusRow(t('Lòt dediksyon'), s.other_deductions, cur),
      ];
    }

    /** Bouton "Telechaje PDF". `quiet`: ti bouton pou lis la. */
    function pdfButton(slipId, quiet) {
      const label = t('Telechaje PDF');
      const btn = h('button', {
        class: quiet ? 'btn btn-quiet btn-sm' : 'btn btn-primary', type: 'button',
      }, label);
      const msg = h('span', { class: 'field-error', role: 'status' });
      btn.addEventListener('click', async () => {
        msg.textContent = '';
        btn.disabled = true;
        btn.textContent = t('Ap prepare PDF la…');
        try {
          await api.download(`/api/payroll/payslips/${slipId}/pdf`, `fich-peye-${slipId}.pdf`);
        } catch (err) {
          msg.textContent = errorText(err);
        } finally {
          btn.disabled = false;
          btn.textContent = label;
        }
      });
      return h('span', { style: 'display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap;' }, btn, msg);
    }

    /** Pozisyon GPS pou klòk in. Si moun nan refize, nou kontinye san li. */
    function getPosition(timeoutMs = 10000) {
      return new Promise((resolve) => {
        if (!navigator.geolocation) return resolve({});
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            latitude: Number(pos.coords.latitude.toFixed(7)),
            longitude: Number(pos.coords.longitude.toFixed(7)),
          }),
          () => resolve({}),
          // Pi presi pou zòn otorize a; pozisyon ki gen plis pase 30 s pa konte.
          { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 30000 },
        );
      });
    }

    const isManager = (role) => ['manager', 'hr', 'org_admin', 'super_admin'].includes(role);

    // -----------------------------------------------------------------------
    // TÈT PAJ
    // -----------------------------------------------------------------------

    function renderGreeting(identity) {
      const name = identity.user.full_name.split(' ')[0];
      const hour = new Date().getHours();
      document.getElementById('greeting').textContent = hour < 12
        ? t('Bonjou, {name}', { name })
        : hour < 18 ? t('Bon apremidi, {name}', { name }) : t('Bonswa, {name}', { name });
      document.getElementById('today-label').textContent = fmt.longDate(new Date());
    }

    // -----------------------------------------------------------------------
    // 4 KAT CHIF — èdtan jodi a, semèn nan, peryòd pewòl la, vakans ki rete
    // -----------------------------------------------------------------------

    function kpiSection() {
      function kpi(label) {
        const value = h('div', { class: 'k-value' }, '—');
        const sub = h('div', { class: 'k-sub' });
        return { el: h('div', { class: 'kpi' }, h('div', { class: 'k-label' }, label), value, sub), value, sub };
      }
      const day = kpi(t('Jodi a'));
      const week = kpi(t('Semèn sa a'));
      const period = kpi(t('Peryòd pewòl'));
      const leave = kpi(t('Jou vakans ki rete'));
      let timer = null;

      async function refreshHours() {
        clearTimeout(timer);
        try {
          const d = await api.get('/api/portal/hours');
          day.value.textContent = fmt.duration(d.day.worked_minutes);
          day.sub.textContent = d.clocked_in ? t('W ap travay kounye a') : '';
          week.value.textContent = fmt.duration(d.week.worked_minutes);
          week.sub.textContent = t('{n} jou travay', { n: d.week.days_worked });
          period.value.textContent = fmt.duration(d.period.worked_minutes);
          // Non peryòd la se HR ki ekri l ("Septanm 2026"): nou pa tradui l.
          period.sub.className = d.needs_correction ? 'k-sub warn' : 'k-sub';
          period.sub.textContent = d.needs_correction
            ? t('{n} jounen san klòk out: HR ap korije yo.', { n: d.needs_correction })
            : (d.period_info.name || t('Mwa sa a'));
          if (d.clocked_in) timer = setTimeout(refreshHours, 60000);
        } catch {
          [day, week, period].forEach((k) => { k.value.textContent = '—'; });
        }
      }

      async function refreshLeave() {
        try {
          const data = await api.get('/api/leaves/me/balances');
          const v = data.balances.find((b) => b.leave_type === 'vacation');
          const total = v ? Number(v.entitled_days) + Number(v.carried_over_days) : 0;
          if (!v || total === 0) {
            leave.value.textContent = '—';
            leave.sub.textContent = t('HR poko mete balans ou.');
          } else {
            leave.value.textContent = String(Math.max(0, Number(v.remaining_days)));
            leave.sub.textContent = t('sou {n} jou', { n: total });
          }
        } catch {
          leave.value.textContent = '—';
        }
      }

      refreshHours();
      refreshLeave();
      return {
        el: h('div', { class: 'dash-kpis' }, day.el, week.el, period.el, leave.el),
        refreshHours,
        refreshLeave,
      };
    }

    // -----------------------------------------------------------------------
    // PREZANS — sèlman si biznis la kite anplwaye yo pwente sou telefòn
    // -----------------------------------------------------------------------

    function clockSection(onChange) {
      const { el, body } = panel(t('Prezans'));
      const bar = h('div', { class: 'clockbar' });
      const dot = h('span', { class: 'dot', 'aria-hidden': 'true' });
      const label = h('div', { class: 'c-label' }, t('Ap chaje…'));
      const time = h('div', { class: 'c-timer', 'aria-live': 'off' }, '00:00:00');
      const since = h('div', { class: 'c-since' });
      const message = h('p', { class: 'field-error', role: 'status' });
      const breakSelect = h('select', { class: 'select', 'aria-label': t('Tan repo'), hidden: true },
        h('option', { value: '0' }, t('Pa gen repo')),
        h('option', { value: '30' }, t('30 min repo')),
        h('option', { value: '60' }, t('1 èdtan repo')),
      );
      breakSelect.style.width = 'auto';
      const button = h('button', { class: 'btn btn-primary', type: 'button', disabled: true }, t('Klòk in'));

      bar.append(dot, h('div', { class: 'c-main' }, label, time, since), h('div', { class: 'c-actions' }, breakSelect, button));
      fill(body, bar, message);

      let timer = null;
      let clockedIn = false;

      function tick(start) {
        time.textContent = fmt.clock((Date.now() - start.getTime()) / 1000);
      }

      function render(status) {
        clearInterval(timer);
        clockedIn = status.clocked_in;
        bar.classList.toggle('is-on', clockedIn);
        breakSelect.hidden = !clockedIn;
        button.disabled = false;

        if (clockedIn) {
          const start = fmt.parseDate(status.entry.clock_in_at);
          label.textContent = t('W ap travay depi');
          since.textContent = t('Ou antre a {time}', { time: fmt.time(start) });
          button.textContent = t('Klòk out');
          button.className = 'btn btn-ghost';
          tick(start);
          timer = setInterval(() => tick(start), 1000);
        } else {
          label.textContent = t('Ou poko antre');
          time.textContent = '00:00:00';
          since.textContent = t('Peze bouton an lè w rive sou travay la.');
          button.textContent = t('Klòk in');
          button.className = 'btn btn-primary';
        }
      }

      async function load() {
        try {
          render(await api.get('/api/attendance/status'));
        } catch (err) {
          label.textContent = t('Prezans');
          message.textContent = errorText(err);
        }
      }

      button.addEventListener('click', async () => {
        message.textContent = '';
        button.disabled = true;
        const original = button.textContent;
        button.textContent = t('Yon ti moman…');
        try {
          let finished = null;
          if (clockedIn) {
            const outPos = await getPosition();
            finished = await api.post('/api/attendance/clock-out', {
              ...outPos,
              break_minutes: Number(breakSelect.value),
            });
          } else {
            const pos = await getPosition();
            await api.post('/api/attendance/clock-in', {
              ...pos,
              device_info: navigator.userAgent.slice(0, 250),
            });
          }
          await load();
          if (finished) {
            since.textContent = t('Jounen fini: {duration} travay.', { duration: fmt.duration(finished.worked_minutes) });
          }
          if (onChange) onChange();
        } catch (err) {
          message.textContent = errorText(err);
          button.textContent = original;
          button.disabled = false;
        }
      });

      load();
      return el;
    }

    // -----------------------------------------------------------------------
    // ORÈ SEMÈN NAN — 7 jou, jou OFF yo make klè (sèlman orè pibliye)
    // -----------------------------------------------------------------------

    function scheduleSection() {
      const { el, body } = panel(t('Orè mwen semèn sa a'));

      api.get('/api/schedules/me').then((week) => {
        if (!week.shifts.length) {
          fill(body, h('p', { class: 'empty' }, t('Pa gen orè pibliye pou semèn sa a.')));
          return;
        }
        const todayIso = fmt.todayIso();
        const today = fmt.parseDate(todayIso);
        const monday = new Date(today);
        monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
        const byDate = new Map(week.shifts.map((s) => [s.work_date, s]));
        const names = fmt.DAYS;          // dimanch an premye

        const cells = Array.from({ length: 7 }, (_, i) => {
          const d = new Date(monday);
          d.setDate(monday.getDate() + i);
          const key = isoDate(d);
          const s = byDate.get(key);
          const cls = ['day', key === todayIso ? 'is-today' : '', s ? '' : 'is-off'].filter(Boolean).join(' ');
          const title = s && (s.template_name || s.note)
            ? [s.template_name, s.note].filter(Boolean).join(' · ')
            : null;
          return h('div', { class: cls, title, 'aria-current': key === todayIso ? 'date' : null },
            h('div', { class: 'dn' }, names[d.getDay()].slice(0, 3)),
            h('div', { class: 'dd' }, String(d.getDate())),
            h('div', { class: 'dt' }, s
              ? `${hhmm(s.start_time)}–${hhmm(s.end_time)}${s.overnight ? ' (+1)' : ''}`
              : t('Repo|orè')),
          );
        });

        fill(body,
          h('div', { class: 'week-strip' }, ...cells),
          h('p', { class: 'sub', style: 'margin-top: 12px;' },
            t('Total semèn nan: {duration}', { duration: fmt.duration(week.minutes_total) })),
        );
      }).catch((err) => fill(body, h('p', { class: 'empty' }, errorText(err))));

      return el;
    }

    // -----------------------------------------------------------------------
    // FICH PEYE
    // -----------------------------------------------------------------------

    function payslipSection() {
      const { el, body } = panel(t('Fich peye'));

      api.get('/api/payroll/me/payslips?limit=6').then((data) => {
        if (!data.items.length) {
          fill(body, h('p', { class: 'empty' }, t('Ou poko gen fich peye. Li ap parèt isit la lè HR fin apwouve pewòl la.')));
          return;
        }

        const s = data.items[0];
        const cur = s.currency;

        const breakdown = h('details', { class: 'breakdown' },
          h('summary', {}, t('Detay kalkil la')),
          h('div', { class: 'rows' },
            moneyRow(t('Salè debaz'), s.base_amount, cur),
            s.overtime_amount ? moneyRow(t('Èdtan siplemantè'), s.overtime_amount, cur) : null,
            s.bonus_amount ? moneyRow(t('Bonis'), s.bonus_amount, cur) : null,
            moneyRow(t('Brit'), s.gross_amount, cur),
            ...deductionRows(s, cur),
            h('div', { class: 'row total' }, h('span', {}, t('Net')), h('span', {}, fmt.money(s.net_amount, cur))),
          ),
        );

        const older = data.items.slice(1);

        fill(body,
          h('p', { class: 'clock-label' }, s.status === 'paid' ? t('Dènye peman') : t('Apwouve, poko peye')),
          h('p', { class: 'pay-net' }, fmt.money(s.net_amount, cur)),
          h('span', { class: 'pay-method' }, fmt.paymentMethod(s)),
          h('p', { class: 'pay-meta' },
            s.paid_at ? t('Peye {date}', { date: fmt.date(s.paid_at) }) : t('Ap peye nan pwochen jou yo'),
          ),
          h('div', { style: 'margin-top: 12px;' }, pdfButton(s.id, false)),
          breakdown,
          older.length ? h('ul', { class: 'list' }, ...older.map((o) =>
            h('li', {},
              h('div', {},
                h('div', {}, fmt.money(o.net_amount, o.currency)),
                h('div', { class: 'sub' }, fmt.paymentMethod(o)),
              ),
              h('div', { style: 'display: flex; align-items: center; gap: 6px;' },
                h('span', { class: 'sub' }, o.paid_at ? fmt.shortDate(o.paid_at) : '—'),
                pdfButton(o.id, true),
              ),
            )
          )) : null,
        );
        if (older.length) body.lastChild.style.marginTop = '14px';
      }).catch((err) => fill(body, h('p', { class: 'empty' }, errorText(err))));

      return el;
    }

    // -----------------------------------------------------------------------
    // TOTAL ANE A — sèlman fich PEYE yo
    // -----------------------------------------------------------------------

    function ytdSection() {
      const { el, body } = panel(t('Total ane a'));

      async function load(year) {
        try {
          const d = await api.get(year ? `/api/portal/ytd?year=${year}` : '/api/portal/ytd');

          const years = d.years.includes(d.year) ? d.years : [d.year, ...d.years];
          let picker = null;
          if (years.length > 1) {
            picker = h('select', { class: 'select', 'aria-label': t('Ane') },
              ...years.map((y) => h('option', { value: String(y) }, String(y))));
            picker.value = String(d.year);
            picker.style.marginBottom = '10px';
            picker.addEventListener('change', () => load(Number(picker.value)));
          }

          const tot = d.totals[0];
          if (!tot) {
            fill(body, picker, h('p', { class: 'empty' }, t('Poko gen fich peye pou {year}.', { year: d.year })));
            return;
          }
          const cur = tot.currency;

          fill(body,
            picker,
            h('p', { class: 'clock-label' }, `${t('Net')} ${d.year}`),
            h('p', { class: 'pay-net' }, fmt.money(tot.net_amount, cur)),
            h('p', { class: 'pay-meta' }, t('Sou {count} fich peye.', { count: tot.payslip_count })),
            h('div', { class: 'rows', style: 'margin-top: 12px;' },
              moneyRow(t('Brit'), tot.gross_amount, cur),
              minusRow(t('Dediksyon'), tot.total_deductions, cur),
              h('div', { class: 'row total' }, h('span', {}, t('Net')), h('span', {}, fmt.money(tot.net_amount, cur))),
            ),
            h('details', { class: 'breakdown' },
              h('summary', {}, t('Detay kalkil la')),
              h('div', { class: 'rows' }, ...deductionRows(tot, cur)),
            ),
          );
        } catch (err) {
          fill(body, h('p', { class: 'empty' }, errorText(err)));
        }
      }

      load(null);
      return el;
    }

    // -----------------------------------------------------------------------
    // KONJE — balans yo, dènye demann yo, fòm lan kache dèyè yon bouton
    // -----------------------------------------------------------------------

    function leaveSection(onChange) {
      const toggle = h('button', { class: 'btn btn-ghost btn-sm', type: 'button', 'aria-expanded': 'false' }, t('Mande konje'));
      const { el, body } = panel(t('Konje'), toggle);

      const balancesBox = h('div', { class: 'balances' });
      const requestsBox = h('div', {});
      const formMessage = h('p', { role: 'status' });

      const typeSelect = h('select', { class: 'select', id: 'leave-type', required: true },
        ...['vacation', 'sick', 'maternity', 'paternity', 'bereavement', 'unpaid', 'other']
          .map((type) => h('option', { value: type }, fmt.leaveType(type))),
      );
      const start = h('input', { class: 'input', id: 'leave-start', type: 'date', required: true });
      const end = h('input', { class: 'input', id: 'leave-end', type: 'date', required: true });
      const reason = h('textarea', { class: 'textarea', id: 'leave-reason', maxlength: '1000' });
      const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, t('Voye demann lan'));

      // Dat LOKAL: toISOString() ta bay demen apre 8è diswa an Ayiti (UTC−4).
      start.min = fmt.todayIso();
      start.addEventListener('change', () => {
        end.min = start.value;
        if (!end.value || end.value < start.value) end.value = start.value;
      });

      const form = h('form', { class: 'leave-form', novalidate: true, hidden: true },
        h('div', { class: 'field' }, h('label', { for: 'leave-type' }, t('Kalite konje')), typeSelect),
        h('div', { class: 'form-row' },
          h('div', { class: 'field' }, h('label', { for: 'leave-start' }, t('Premye jou')), start),
          h('div', { class: 'field' }, h('label', { for: 'leave-end' }, t('Dènye jou')), end),
        ),
        h('div', { class: 'field' },
          h('label', { for: 'leave-reason' }, t('Rezon (opsyonèl)')),
          reason,
          h('span', { class: 'hint' }, t('Sèlman manadjè w ak HR ap wè sa.')),
        ),
        h('div', {}, submit),
      );

      function setOpen(open) {
        form.hidden = !open;
        toggle.setAttribute('aria-expanded', String(open));
        toggle.textContent = open ? t('Kache fòm lan') : t('Mande konje');
        if (open) typeSelect.focus();
      }
      toggle.addEventListener('click', () => setOpen(form.hidden));

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        formMessage.className = '';
        formMessage.textContent = '';

        if (!start.value || !end.value) {
          formMessage.className = 'field-error';
          formMessage.textContent = t('Chwazi premye ak dènye jou konje a.');
          return;
        }

        submit.disabled = true;
        try {
          const created = await api.post('/api/leaves', {
            leave_type: typeSelect.value,
            start_date: start.value,
            end_date: end.value,
            reason: reason.value.trim() || null,
          });
          form.reset();
          setOpen(false);
          formMessage.className = 'alert alert-ok';
          formMessage.textContent =
            t('Demann lan voye: {days} jou travay. Manadjè w ap resevwa l.', { days: created.total_days });
          await load();
          if (onChange) onChange();
        } catch (err) {
          formMessage.className = 'field-error';
          formMessage.textContent = errorText(err);
        } finally {
          submit.disabled = false;
        }
      });

      async function load() {
        const [balances, requests] = await Promise.allSettled([
          api.get('/api/leaves/me/balances'),
          api.get('/api/leaves/me'),
        ]);

        if (balances.status === 'fulfilled') {
          const items = balances.value.balances;
          fill(balancesBox, items.length
            ? items.map((b) => {
                const total = Number(b.entitled_days) + Number(b.carried_over_days);
                // Pa gen balans (0 jou): pa montre yon chif negatif ki pa vle di anyen.
                if (total === 0) {
                  return h('div', { class: 'balance' },
                    h('div', { class: 'n' }, '—'),
                    h('div', { class: 't' }, t('{type}: HR poko mete balans lan', { type: fmt.leaveType(b.leave_type) })),
                  );
                }
                return h('div', { class: 'balance' },
                  h('div', { class: 'n' }, String(Math.max(0, Number(b.remaining_days))), h('small', {}, ` / ${total}`)),
                  h('div', { class: 't' }, t('{type}: jou ki rete', { type: fmt.leaveType(b.leave_type) })),
                );
              })
            : h('p', { class: 'empty' }, t('HR poko mete balans konje w pou ane sa a.')));
        } else {
          fill(balancesBox, h('p', { class: 'empty' }, errorText(balances.reason)));
        }

        if (requests.status === 'fulfilled' && requests.value.items.length) {
          const recent = requests.value.items.slice(0, 3);
          fill(requestsBox,
            h('ul', { class: 'list' }, ...recent.map((r) =>
              h('li', {},
                h('div', {},
                  h('div', {}, t('{type} — {days} jou', { type: fmt.leaveType(r.leave_type), days: r.total_days })),
                  h('div', { class: 'sub' }, `${fmt.shortDate(r.start_date)} → ${fmt.shortDate(r.end_date)}`),
                ),
                h('span', { class: `badge badge-${r.status}` }, fmt.requestStatus(r.status)),
              )
            )),
          );
          requestsBox.style.marginTop = '14px';
        } else {
          fill(requestsBox);
        }
      }

      fill(body, balancesBox, formMessage, form, requestsBox);
      load();
      return el;
    }

    // -----------------------------------------------------------------------
    // CHÈN KOMANDMAN — "moun ki sou tèt mwen"
    // -----------------------------------------------------------------------

    function chainSection() {
      const { el, body } = panel(t('Ekip ou'));

      api.get('/api/hierarchy/me/chain').then((data) => {
        if (!data.chain.length) {
          fill(body, h('p', { class: 'empty' }, t('Pa gen pesonn sou tèt ou nan òganigram lan.')));
          return;
        }
        const topDown = [...data.chain].reverse();
        const person = (p, isMe) => {
          const fullName = `${p.first_name} ${p.last_name}`;
          return h('li', { class: isMe ? 'me' : null },
            h('span', { class: 'avatar', 'aria-hidden': 'true' }, initials(fullName)),
            h('div', {},
              h('div', { class: 'who' }, isMe ? t('{name} (ou)', { name: fullName }) : fullName),
              h('div', { class: 'num' }, p.employee_number),
            ),
          );
        };
        fill(body, h('ol', { class: 'chain', 'aria-label': t('Chèn komandman') },
          ...topDown.map((p) => person(p, false)),
          person(data.employee, true),
        ));
      }).catch((err) => fill(body, h('p', { class: 'empty' }, errorText(err))));

      return el;
    }

    // -----------------------------------------------------------------------
    // FÒMASYON
    // -----------------------------------------------------------------------

    function trainingSection() {
      const { el, body } = panel(t('Fòmasyon'));

      api.get('/api/training/me/courses').then((data) => {
        if (!data.items.length) {
          fill(body, h('p', { class: 'empty' }, t('Ou pa gen okenn fòmasyon pou kounye a.')));
          return;
        }
        fill(body, ...data.items.map((c) => {
          const done = Boolean(c.completed_at);
          const bar = h('div', { class: done ? 'bar done' : 'bar', role: 'progressbar',
            'aria-valuenow': String(c.progress_percent), 'aria-valuemin': '0', 'aria-valuemax': '100',
            'aria-label': t('Pwogrè: {title}', { title: c.course.title }) },
            h('span', {}),
          );
          bar.firstChild.style.width = `${c.progress_percent}%`;

          let status;
          if (done) status = h('span', { class: 'badge badge-approved' }, t('Fini'));
          else if (c.is_overdue) status = h('span', { class: 'badge badge-late' }, t('An reta'));
          else if (c.due_date) status = h('span', { class: 'sub' }, t('Anvan {date}', { date: fmt.shortDate(c.due_date) }));

          return h('div', { class: 'course' },
            h('div', { class: 'course-top' },
              h('span', { class: 'course-title' }, c.course.title),
              status,
            ),
            bar,
          );
        }));
      }).catch((err) => fill(body, h('p', { class: 'empty' }, errorText(err))));

      return el;
    }

    // -----------------------------------------------------------------------
    // MANADJÈ / HR — APWOBASYON AK PREZANS
    // -----------------------------------------------------------------------

    function approvalsSection() {
      const { el, body } = panel(t('Demann konje pou ou apwouve'));

      async function load() {
        try {
          const data = await api.get('/api/leaves/pending');
          if (!data.items.length) {
            fill(body, h('p', { class: 'empty' }, t('Pa gen okenn demann k ap tann ou.')));
            return;
          }
          fill(body, ...data.items.map(({ request: r, employee_name }) => {
            const note = h('input', { class: 'input', type: 'text', placeholder: t('Nòt (opsyonèl)'),
              'aria-label': t('Nòt pou {name}', { name: employee_name }), maxlength: '500' });
            const msg = h('p', { class: 'field-error', role: 'status' });

            async function decide(approve, buttons) {
              buttons.forEach((b) => { b.disabled = true; });
              msg.textContent = '';
              try {
                await api.post(`/api/leaves/${r.id}/decide`, {
                  approve,
                  note: note.value.trim() || null,
                });
                await load();
              } catch (err) {
                msg.textContent = errorText(err);
                buttons.forEach((b) => { b.disabled = false; });
              }
            }

            const yes = h('button', { class: 'btn btn-primary btn-sm', type: 'button' }, t('Apwouve|aksyon'));
            const no = h('button', { class: 'btn btn-danger btn-sm', type: 'button' }, t('Refize|aksyon'));
            yes.addEventListener('click', () => decide(true, [yes, no]));
            no.addEventListener('click', () => decide(false, [yes, no]));

            return h('div', { class: 'approval' },
              h('div', {},
                h('div', { class: 'who' }, employee_name),
                h('div', { class: 'what' },
                  t('{type} — {days} jou', { type: fmt.leaveType(r.leave_type), days: r.total_days })
                  + ` · ${fmt.shortDate(r.start_date)} → ${fmt.shortDate(r.end_date)}`),
                r.reason ? h('div', { class: 'what' }, `« ${r.reason} »`) : null,
              ),
              note,
              h('div', { class: 'actions' }, yes, no),
              msg,
            );
          }));
        } catch (err) {
          fill(body, h('p', { class: 'empty' }, errorText(err)));
        }
      }

      load();
      return el;
    }

    function todaySection() {
      const { el, body } = panel(t('Prezans jodi a'));

      api.get('/api/attendance/today').then((d) => {
        const stat = (n, label) => h('div', { class: 'stat' }, h('div', { class: 'n' }, String(n)), h('div', { class: 't' }, label));
        fill(body,
          h('div', { class: 'stat-line' },
            stat(d.present_count, t('antre jodi a')),
            stat(d.still_working, t('ap travay kounye a')),
            stat(d.total_active_employees, t('anplwaye aktif')),
          ),
          d.present.length ? h('ul', { class: 'list' }, ...d.present.slice(0, 8).map((p) =>
            h('li', {},
              h('span', {}, `${p.full_name} · ${p.employee_number}`),
              h('span', { class: 'sub' },
                p.clocked_out
                  ? `${fmt.time(p.clock_in_at)} — ${fmt.duration(p.worked_minutes)}`
                  : t('depi {time}', { time: fmt.time(p.clock_in_at) })),
            )
          )) : null,
        );
        if (d.present.length) body.lastChild.style.marginTop = '14px';
      }).catch((err) => fill(body, h('p', { class: 'empty' }, errorText(err))));

      return el;

    // -----------------------------------------------------------------------
    // TAN TRAVAY — pwentaj peryòd pewòl la (+ klòk in si biznis la pèmèt telefòn)
    // -----------------------------------------------------------------------

    // Tèks yo ekri dirèkteman anndan t(): konsa check_i18n.py jwenn kle yo.
    const ENTRY_STATUS = {
      open: () => [t('Ap travay|estati'), 'badge-pending'],
      closed: () => [t('Konplè|pwentaj'), 'badge-approved'],
      missing_out: () => [t('San klòk out'), 'badge-late'],
      adjusted: () => [t('Korije pa HR'), 'badge-approved'],
    };

    function timeSection(kioskOnly, onHoursChange) {
      const wrap = h('div', { class: 'tab-panel' });
      const { el, body } = panel(t('Pwentaj peryòd la'));

      async function loadEntries() {
        try {
          const hours = await api.get('/api/portal/hours');
          const p = hours.period;
          const params = new URLSearchParams({ start_date: p.start_date, end_date: p.end_date, limit: '200' });
          const data = await api.get(`/api/attendance/me?${params}`);

          const line = h('p', { class: 'period-line' },
            `${hours.period_info.name ? `${hours.period_info.name} · ` : ''}`
            + `${fmt.shortDate(p.start_date)} → ${fmt.shortDate(p.end_date)} · `
            + `${t('{n} jou travay', { n: p.days_worked })} · ${fmt.duration(p.worked_minutes)}`
            + (p.overtime_minutes ? ` · ${t('Siplemantè')}: ${fmt.duration(p.overtime_minutes)}` : ''));

          if (!data.items.length) {
            fill(body, line, h('p', { class: 'empty' }, t('Pa gen pwentaj nan peryòd sa a.')));
            return;
          }

          const rows = data.items.map((e) => {
            const [label, badge] = ENTRY_STATUS[e.status] ? ENTRY_STATUS[e.status]() : [e.status, ''];
            return h('tr', {},
              h('td', {}, fmt.shortDate(e.work_date)),
              h('td', { class: 'num' }, fmt.time(e.clock_in_at)),
              h('td', { class: 'num' }, e.clock_out_at ? fmt.time(e.clock_out_at) : '—'),
              h('td', { class: 'num hide-sm' }, e.break_minutes ? fmt.duration(e.break_minutes) : '—'),
              h('td', { class: 'num' }, e.worked_minutes != null ? fmt.duration(e.worked_minutes) : '—'),
              h('td', {}, h('span', { class: `badge ${badge}` }, label)),
            );
          });

          fill(body, line, h('div', { class: 'table-wrap' },
            h('table', { class: 'table entries' },
              h('thead', {}, h('tr', {},
                h('th', { scope: 'col' }, t('Dat')),
                h('th', { scope: 'col' }, t('Antre|pwentaj')),
                h('th', { scope: 'col' }, t('Sòti|pwentaj')),
                h('th', { scope: 'col', class: 'hide-sm' }, t('Tan repo')),
                h('th', { scope: 'col' }, t('Travay|kolòn')),
                h('th', { scope: 'col' }, t('Estati')),
              )),
              h('tbody', {}, ...rows),
            )));
        } catch (err) {
          fill(body, h('p', { class: 'empty' }, errorText(err)));
        }
      }

      if (kioskOnly) {
        wrap.append(h('p', { class: 'dash-note', style: 'margin: 0;' },
          t('Biznis ou a sèvi ak tablèt la pou pwentaj. Pwente sou tablèt la lè w rive ak lè w ale.')));
      } else {
        wrap.append(clockSection(() => { onHoursChange(); loadEntries(); }));
      }
      wrap.append(el);
      loadEntries();
      return wrap;
    }

    // -----------------------------------------------------------------------
    // BA BOUTON YO — yon seksyon alafwa; chwa a rete nan #hash la
    // -----------------------------------------------------------------------

    // -----------------------------------------------------------------------
    // DOSYE MWEN — travay, kontak, ak fason m resevwa salè m
    // -----------------------------------------------------------------------

    const METHOD_LABELS = {
      check: () => t('Chèk'),
      direct_deposit: () => t('Depo dirèk'),
      cash: () => t('Kach'),
      moncash: () => 'MonCash',
      natcash: () => 'NatCash',
    };
    const methodLabel = (m) => (METHOD_LABELS[m] ? METHOD_LABELS[m]() : m);

    /** "MonCash · …3456" — non bank lan ekri pa anplwaye a, jan li ekri l. */
    function paymentText(method, bank, last4) {
      return [methodLabel(method), bank, last4 ? `…${last4}` : null].filter(Boolean).join(' · ');
    }

    function profileSection() {
      const wrap = h('div', { class: 'tab-panel' });
      const work = panel(t('Travay mwen'));
      const contact = panel(t('Kontak ou'));
      const pay = panel(t('Kijan ou resevwa salè w'));
      wrap.append(work.el, contact.el, pay.el);

      const row = (label, value) => h('div', { class: 'row' },
        h('span', { class: 'k' }, label), h('span', {}, value || '—'));

      function renderWork(p) {
        fill(work.body,
          h('div', { class: 'rows' },
            row(t('Nimewo anplwaye'), p.employee_number),
            row(t('Pozisyon'), p.position_title),
            row(t('Depatman'), p.department_name),
            row(t('Manadjè'), p.manager_name),
            row(t('Dat anbochaj'), p.hire_date ? fmt.date(p.hire_date) : null),
            row(t('Imel koneksyon'), p.login_email),
          ),
          h('p', { class: 'hint', style: 'display: block; margin-top: 10px;' },
            t('Pou chanje enfòmasyon sa yo, pale ak HR.')),
        );
      }

      function renderContact(p) {
        const FIELDS = [
          ['phone', t('Telefòn'), 'tel', 50],
          ['personal_email', t('Imel pèsonèl'), 'email', 255],
          ['address', t('Adrès'), 'text', 500],
          ['city', t('Vil'), 'text', 100],
          ['emergency_contact_name', t('Moun pou rele an ijans'), 'text', 200],
          ['emergency_contact_phone', t('Telefòn moun sa a'), 'tel', 50],
        ];
        const inputs = {};
        const msg = h('p', { role: 'status' });
        const save = h('button', { class: 'btn btn-primary', type: 'submit' }, t('Anrejistre'));
        const form = h('form', { novalidate: true },
          h('div', { style: 'display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));' },
            ...FIELDS.map(([key, label, type, max]) => {
              inputs[key] = h('input', { class: 'input', id: `me-${key}`, type, maxlength: String(max) });
              inputs[key].value = p[key] || '';
              return h('div', { class: 'field' }, h('label', { for: `me-${key}` }, label), inputs[key]);
            })),
          h('div', { class: 'form-actions', style: 'margin-top: 12px;' }, save),
          msg,
        );
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          msg.className = '';
          msg.textContent = '';
          const patch = {};
          for (const [key] of FIELDS) {
            const value = inputs[key].value.trim();
            if (value !== (p[key] || '')) patch[key] = value;
          }
          if (!Object.keys(patch).length) return;
          save.disabled = true;
          try {
            const saved = await api.patch('/api/profile/me', patch);
            Object.assign(p, saved);
            msg.className = 'alert alert-ok';
            msg.textContent = t('Kontak ou anrejistre.');
          } catch (err) {
            msg.className = 'field-error';
            msg.textContent = errorText(err);
          } finally {
            save.disabled = false;
          }
        });
        fill(contact.body, form);
      }

      async function renderPayment(p) {
        const current = h('p', { class: 'pay-method', style: 'margin-top: 0;' },
          paymentText(p.payment.method, p.payment.bank_name, p.payment.account_last4));
        const history = h('div', {});
        const msg = h('p', { role: 'status' });
        const toggle = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' }, t('Mande yon chanjman'));

        const method = h('select', { class: 'select', id: 'pc-method' },
          ...['direct_deposit', 'moncash', 'natcash', 'check', 'cash']
            .map((m) => h('option', { value: m }, methodLabel(m))));
        const bank = h('input', { class: 'input', id: 'pc-bank', maxlength: '150', autocomplete: 'off' });
        const account = h('input', { class: 'input', id: 'pc-account', maxlength: '80', autocomplete: 'off', inputmode: 'numeric' });
        const password = h('input', { class: 'input', id: 'pc-password', type: 'password', autocomplete: 'current-password', maxlength: '200' });
        const accountLabel = h('label', { for: 'pc-account' });
        const bankField = h('div', { class: 'field' }, h('label', { for: 'pc-bank' }, t('Non bank lan')), bank);
        const accountField = h('div', { class: 'field' }, accountLabel, account);
        const submit = h('button', { class: 'btn btn-primary', type: 'submit' }, t('Voye demann lan'));

        function syncMethod() {
          const m = method.value;
          bankField.hidden = m !== 'direct_deposit';
          accountField.hidden = !['direct_deposit', 'moncash', 'natcash'].includes(m);
          accountLabel.textContent = m === 'direct_deposit'
            ? t('Nimewo kont lan') : t('Nimewo telefòn MonCash oswa NatCash');
        }
        method.addEventListener('change', syncMethod);
        syncMethod();

        const form = h('form', { novalidate: true, hidden: true, style: 'margin-top: 14px; display: grid; gap: 12px;' },
          h('div', { class: 'field' }, h('label', { for: 'pc-method' }, t('Nouvo fason')), method),
          bankField,
          accountField,
          h('div', { class: 'field' },
            h('label', { for: 'pc-password' }, t('Modpas ou (pou konfime se ou)')), password),
          h('p', { class: 'hint', style: 'display: block; margin: 0;' },
            t('HR ap verifye demann lan avè w anvan li aplike l. Fich peye ki deja kalkile yo pa chanje.')),
          h('div', {}, submit),
        );

        toggle.addEventListener('click', () => {
          form.hidden = !form.hidden;
          toggle.textContent = form.hidden ? t('Mande yon chanjman') : t('Kache fòm lan');
          if (!form.hidden) method.focus();
        });

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          msg.className = '';
          msg.textContent = '';
          submit.disabled = true;
          try {
            await api.post('/api/payment-changes/me', {
              method: method.value,
              bank_name: bank.value.trim() || null,
              account_number: account.value.trim() || null,
              password: password.value,
            });
            form.reset();
            form.hidden = true;
            syncMethod();
            msg.className = 'alert alert-ok';
            msg.textContent = t('Demann lan voye. HR ap kontakte w pou konfime l.');
            await loadHistory();
          } catch (err) {
            msg.className = 'field-error';
            msg.textContent = errorText(err);
          } finally {
            password.value = '';
            submit.disabled = false;
          }
        });

        async function loadHistory() {
          try {
            const data = await api.get('/api/payment-changes/me');
            const pending = data.items.some((r) => r.status === 'pending');
            toggle.hidden = pending;
            if (pending) form.hidden = true;
            fill(history, data.items.length ? h('ul', { class: 'list', style: 'margin-top: 14px;' },
              ...data.items.map((r) => {
                const cancel = r.status === 'pending'
                  ? h('button', { class: 'btn btn-quiet btn-sm', type: 'button' }, t('Anile demann lan'))
                  : null;
                if (cancel) {
                  cancel.addEventListener('click', async () => {
                    cancel.disabled = true;
                    try {
                      await api.post(`/api/payment-changes/me/${r.id}/cancel`, {});
                      await loadHistory();
                    } catch (err) {
                      msg.className = 'field-error';
                      msg.textContent = errorText(err);
                      cancel.disabled = false;
                    }
                  });
                }
                return h('li', {},
                  h('div', {},
                    h('div', {}, paymentText(r.method, r.bank_name, r.account_last4)),
                    h('div', { class: 'sub' }, fmt.shortDate(r.created_at)),
                    // Nòt la ekri pa HR, jan li ekri l.
                    r.decision_note ? h('div', { class: 'sub' }, `« ${r.decision_note} »`) : null,
                  ),
                  h('div', { style: 'display: flex; align-items: center; gap: 8px;' },
                    h('span', { class: `badge badge-${r.status}` }, fmt.requestStatus(r.status)),
                    cancel),
                );
              })) : null);
          } catch (err) {
            fill(history, h('p', { class: 'empty' }, errorText(err)));
          }
        }

        fill(pay.body, current, toggle, form, msg, history);
        loadHistory();
      }

      api.get('/api/profile/me').then((p) => {
        renderWork(p);
        renderContact(p);
        renderPayment(p);
      }).catch((err) => {
        fill(work.body, h('p', { class: 'empty' }, errorText(err)));
        fill(contact.body);
        fill(pay.body);
      });
      return wrap;
    }

    // -----------------------------------------------------------------------
    // KÒLÈG OU YO — moun ki gen menm manadjè avè w (non ak pozisyon sèlman)
    // -----------------------------------------------------------------------

    function colleaguesSection() {
      const { el, body } = panel(t('Kòlèg ou yo'));
      api.get('/api/profile/team').then((d) => {
        if (!d.colleagues.length) {
          fill(body, h('p', { class: 'empty' }, t('Pa gen lòt moun anba menm manadjè avè w.')));
          return;
        }
        fill(body, h('ul', { class: 'list' }, ...d.colleagues.map((c) => h('li', {},
          h('span', { class: 'avatar', 'aria-hidden': 'true' }, initials(c.name)),
          h('div', { style: 'flex: 1;' },
            h('div', {}, c.name),
            h('div', { class: 'sub' }, [c.employee_number, c.position_title].filter(Boolean).join(' · '))),
        ))));
      }).catch((err) => fill(body, h('p', { class: 'empty' }, errorText(err))));
      return el;
    }

    const ICONS = {
      calendar: ['M4 6h16v14H4z', 'M4 10h16', 'M8 3v4', 'M16 3v4'],
      receipt: ['M6 3h12v18l-3-2-3 2-3-2-3 2z', 'M9 8h6', 'M9 12h6'],
      clock: ['M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z', 'M12 7v5l3 2'],
      sun: ['M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', 'M12 2v2', 'M12 20v2', 'M4.9 4.9l1.4 1.4',
        'M17.7 17.7l1.4 1.4', 'M2 12h2', 'M20 12h2', 'M4.9 19.1l1.4-1.4', 'M17.7 6.3l1.4-1.4'],
      chart: ['M4 20V10', 'M10 20V4', 'M16 20v-7', 'M22 20H2'],
      user: ['M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', 'M4 21a8 8 0 0 1 16 0'],
    };

    function icon(name) {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      for (const [k, v] of Object.entries({
        viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true',
      })) svg.setAttribute(k, v);
      for (const d of ICONS[name]) {
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        svg.append(path);
      }
      return svg;
    }

    function tabsSection(tabs) {
      const panelBox = h('div', { class: 'tab-panel', role: 'tabpanel', id: 'dash-panel' });
      const rendered = new Map();          // chak seksyon chaje yon sèl fwa
      const buttons = tabs.map((tab) => {
        const btn = h('button', {
          class: 'dash-tab', type: 'button', role: 'tab', id: `tab-${tab.id}`,
          'aria-controls': 'dash-panel', 'aria-selected': 'false', tabindex: '-1',
        }, icon(tab.icon), h('span', {}, tab.label));
        btn.addEventListener('click', () => select(tab.id, true));
        return btn;
      });

      function select(id, fromClick) {
        const index = Math.max(0, tabs.findIndex((tb) => tb.id === id));
        const tab = tabs[index];
        buttons.forEach((b, i) => {
          b.setAttribute('aria-selected', String(i === index));
          b.tabIndex = i === index ? 0 : -1;
        });
        panelBox.setAttribute('aria-labelledby', `tab-${tab.id}`);
        if (!rendered.has(tab.id)) rendered.set(tab.id, tab.render());
        panelBox.replaceChildren(rendered.get(tab.id));
        if (fromClick) {
          history.replaceState(null, '', `#${tab.id}`);
          buttons[index].scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
      }

      const bar = h('div', { class: 'dash-tabs', role: 'tablist', 'aria-label': t('Seksyon yo') }, ...buttons);
      bar.addEventListener('keydown', (e) => {
        if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
        const current = buttons.findIndex((b) => b.getAttribute('aria-selected') === 'true');
        const rtl = document.documentElement.dir === 'rtl';
        const step = (e.key === 'ArrowRight') !== rtl ? 1 : -1;
        const next = (current + step + buttons.length) % buttons.length;
        select(tabs[next].id, true);
        buttons[next].focus();
      });
      window.addEventListener('hashchange', () => select(location.hash.slice(1), false));

      select(location.hash.slice(1), false);
      return h('div', {}, bar, panelBox);
    }

    // -----------------------------------------------------------------------
    // DEMARAJ
    // -----------------------------------------------------------------------

    async function start() {
      const identity = await shell.mount('dashboard');
      if (!identity) return;

      renderGreeting(identity);
      const role = identity.user.role;
      const hasEmployee = Boolean(identity.employee_id);
      const isAdmin = shell.ADMIN.includes(role);

      if (hasEmployee) {
        // Mòd "kiosk": pwentaj la fèt sou tablèt biznis la — pa gen bouton sou telefòn nan.
        const settings = await api.get('/api/kiosk/settings').catch(() => ({ clock_mode: 'phone' }));
        const kioskOnly = settings.clock_mode === 'kiosk';

        const kpis = kpiSection();
        top.append(kpis.el);

        colMain.append(tabsSection([
          { id: 'ore', label: t('Orè'), icon: 'calendar', render: scheduleSection },
          { id: 'fich-peye', label: t('Fich peye'), icon: 'receipt', render: payslipSection },
          { id: 'tan-travay', label: t('Tan travay'), icon: 'clock',
            render: () => timeSection(kioskOnly, kpis.refreshHours) },
          { id: 'konje', label: t('Konje'), icon: 'sun', render: () => leaveSection(kpis.refreshLeave) },
          { id: 'total-ane', label: t('Total ane a'), icon: 'chart', render: ytdSection },
          { id: 'dosye', label: t('Dosye mwen'), icon: 'user', render: profileSection },
        ]));

        if (isManager(role)) colSide.append(approvalsSection(), todaySection());
        colSide.append(chainSection(), colleaguesSection(), trainingSection());
        return;
      }

      // Admin san dosye anplwaye: tablo jesyon an okipe tout lajè a.
      const goEmployees = h('a', { class: 'btn btn-primary btn-sm', href: 'employees.html' }, t('Jere anplwaye yo'));
      colMain.append(
        h('div', { class: 'notice' },
          h('p', {}, t('Kont ou a se yon kont administratè, san dosye anplwaye — donk ou pa gen klòk in, fich peye ni konje pou tèt ou isit la.')),
          isAdmin ? h('div', { style: 'margin-top: 12px;' }, goEmployees) : null,
        ),
        todaySection(),
      );
      if (isManager(role)) colSide.append(approvalsSection());
    }

    start();
  })();
  </script>
