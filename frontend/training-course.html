<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kou — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <a class="back-link" href="training.html">Tout kou yo</a>

        <div id="content"><p class="loading">Ap chaje…</p></div>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, fmt, h, ApiError, shell } = Konbit;

    const identity = await shell.mount('training', shell.ADMIN);
    if (!identity) return;

    const content = document.getElementById('content');
    const id = Number(new URLSearchParams(location.search).get('id'));

    if (!Number.isInteger(id) || id <= 0) {
      content.replaceChildren(h('div', { class: 'alert alert-error' }, 'Pa gen kou chwazi. Retounen nan lis la.'));
      return;
    }

    let course = null;      // CourseDetail: chan kou a + lessons[]
    let employees = [];     // pou lis asiyasyon an
    const selectedEmployeeIds = new Set();

    // -------------------------------------------------------------------
    // ZOUTI
    // -------------------------------------------------------------------

    function errorMessage(err) {
      let msg = err instanceof ApiError ? err.message : 'Yon bagay pa mache.';
      if (err && err.fields && err.fields.length) {
        msg += ' ' + err.fields.map((f) => `${f.field}: ${f.message}`).join('; ');
      }
      return msg;
    }

    function field(label, inputEl, hint) {
      return h('div', { class: 'field' },
        h('label', { for: inputEl.id }, label),
        inputEl,
        hint ? h('span', { class: 'hint' }, hint) : null,
      );
    }

    function input(id, value, attrs = {}) {
      const el = h('input', { class: 'input', id, autocomplete: 'off', ...attrs });
      el.value = value ?? '';
      return el;
    }

    function textarea(id, value, attrs = {}) {
      const el = h('textarea', { class: 'textarea', id, ...attrs });
      el.value = value ?? '';
      return el;
    }

    function durationLabel(seconds) {
      if (!seconds) return '—';
      const m = Math.floor(seconds / 60);
      const s = seconds % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    // -------------------------------------------------------------------
    // CHAJE
    // -------------------------------------------------------------------

    async function load() {
      try {
        course = await api.get(`/api/training/courses/${id}`);
        render();
      } catch (err) {
        content.replaceChildren(h('div', { class: 'alert alert-error' }, errorMessage(err)));
      }
    }

    // -------------------------------------------------------------------
    // RANN
    // -------------------------------------------------------------------

    function render() {
      document.title = `${course.title} — KONMBIT`;
      const actionMsg = h('p', { class: 'field-error', role: 'status' });

      const actions = [];

      const publishBtn = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' },
        course.is_published ? 'Retire nan piblikasyon' : 'Pibliye');
      publishBtn.addEventListener('click', async () => {
        actionMsg.textContent = '';
        publishBtn.disabled = true;
        try {
          course = await api.post(`/api/training/courses/${id}/publish`, { publish: !course.is_published });
          await load();
        } catch (err) {
          actionMsg.textContent = errorMessage(err);
          publishBtn.disabled = false;
        }
      });
      actions.push(publishBtn);

      if (!course.is_published) {
        const deleteBtn = h('button', { class: 'btn btn-danger btn-sm', type: 'button' }, 'Efase');
        deleteBtn.addEventListener('click', async () => {
          if (!confirm(`Efase kou "${course.title}" nèt? Sa pa ka defèt.`)) return;
          deleteBtn.disabled = true;
          try {
            await api.del(`/api/training/courses/${id}`);
            location.href = 'training.html';
          } catch (err) {
            actionMsg.textContent = errorMessage(err);
            deleteBtn.disabled = false;
          }
        });
        actions.push(deleteBtn);
      }

      const head = h('div', { class: 'emp-head' },
        h('div', { class: 'emp-head-text' },
          h('h1', {}, course.title),
          h('p', { class: 'emp-meta' },
            h('span', { class: `badge ${course.is_published ? 'badge-approved' : 'badge-pending'}` },
              course.is_published ? 'Pibliye' : 'Bouyon'),
            h('span', {}, `${course.lesson_count} leson`),
            h('span', {}, `Nòt pou pase: ${course.passing_score}%`),
            course.is_mandatory ? h('span', {}, 'Obligatwa') : null,
          ),
        ),
        h('div', { class: 'emp-actions' }, ...actions),
      );

      content.replaceChildren(
        head,
        actionMsg,
        editPanel(),
        lessonsPanel(),
        assignPanel(),
        reportPanel(),
      );

      loadReport();
    }

    // -------------------------------------------------------------------
    // FÒM MODIFYE KOU A
    // -------------------------------------------------------------------

    function editPanel() {
      const title = input('e-title', course.title, { required: true, minlength: '2', maxlength: '200' });
      const desc = textarea('e-desc', course.description, { rows: '3', maxlength: '4000' });
      const category = input('e-category', course.category, { maxlength: '100' });
      const lang = h('select', { class: 'select', id: 'e-lang' },
        ...[['ht', 'Kreyòl'], ['fr', 'Fransè'], ['en', 'Anglè'], ['es', 'Panyòl']]
          .map(([v, l]) => h('option', { value: v }, l)));
      lang.value = course.language;
      const passing = input('e-passing', String(course.passing_score), { type: 'number', min: '0', max: '100' });
      const mandatory = h('input', { type: 'checkbox', id: 'e-mandatory' });
      mandatory.checked = Boolean(course.is_mandatory);

      const msg = h('p', { class: 'field-error', role: 'status' });
      const saveBtn = h('button', { class: 'btn btn-primary', type: 'submit' }, 'Sove chanjman yo');

      const form = h('form', { novalidate: true },
        h('div', { class: 'form-grid' },
          h('div', { class: 'field span-2' }, field('Tit kou a', title)),
          h('div', { class: 'field span-2' }, field('Deskripsyon', desc)),
          field('Kategori', category),
          field('Lang', lang),
          field('Nòt pou pase (%)', passing),
          h('div', { class: 'field' },
            h('label', {}, h('span', { class: 'check' }, mandatory, ' Kou obligatwa')),
          ),
        ),
        msg,
        h('div', { class: 'form-actions' }, saveBtn),
      );

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';

        const desired = {
          title: title.value.trim(),
          description: desc.value.trim() || null,
          category: category.value.trim() || null,
          language: lang.value,
          passing_score: Number(passing.value) || 0,
          is_mandatory: mandatory.checked,
        };
        const current = {
          title: course.title,
          description: course.description ?? null,
          category: course.category ?? null,
          language: course.language,
          passing_score: course.passing_score,
          is_mandatory: Boolean(course.is_mandatory),
        };
        const changes = {};
        for (const [k, v] of Object.entries(desired)) {
          if (current[k] !== v) changes[k] = v;
        }

        if (!Object.keys(changes).length) {
          msg.className = 'hint';
          msg.textContent = 'Pa gen anyen ki chanje.';
          return;
        }

        saveBtn.disabled = true;
        try {
          await api.patch(`/api/training/courses/${id}`, changes);
          msg.className = 'hint';
          msg.textContent = 'Chanjman yo sove.';
          await load();
        } catch (err) {
          msg.className = 'field-error';
          msg.textContent = errorMessage(err);
          saveBtn.disabled = false;
        }
      });

      return h('section', { class: 'panel', style: 'margin-top: 20px;' },
        h('div', { class: 'panel-head' }, h('h2', {}, 'Detay kou a')),
        form,
      );
    }

    // -------------------------------------------------------------------
    // LESON YO
    // -------------------------------------------------------------------

    function lessonsPanel() {
      const list = h('div', { style: 'display: grid; gap: 12px;' },
        ...(course.lessons.length
          ? course.lessons.map((lesson, i) => lessonCard(lesson, i))
          : [h('p', { class: 'empty' }, 'Pa gen leson ankò.')]),
      );

      return h('section', { class: 'panel', style: 'margin-top: 20px;' },
        h('div', { class: 'panel-head' }, h('h2', {}, `Leson (${course.lessons.length})`)),
        list,
        addLessonForm(),
      );
    }

    async function moveLesson(lessonId, direction) {
      const ids = course.lessons.map((l) => l.id);
      const i = ids.indexOf(lessonId);
      const j = i + direction;
      if (j < 0 || j >= ids.length) return;
      [ids[i], ids[j]] = [ids[j], ids[i]];
      try {
        await api.post(`/api/training/courses/${id}/reorder`, { lesson_ids: ids });
        await load();
      } catch (err) {
        alert(errorMessage(err));
      }
    }

    function lessonCard(lesson, index) {
      const title = input(`l-title-${lesson.id}`, lesson.title, { maxlength: '200' });
      const video = input(`l-video-${lesson.id}`, lesson.video_url, { placeholder: 'https://...mp4 oswa lyen YouTube' });
      const duration = input(`l-dur-${lesson.id}`, lesson.duration_seconds ?? '', { type: 'number', min: '0' });
      const desc = textarea(`l-desc-${lesson.id}`, lesson.description, { rows: '2', maxlength: '2000' });
      const required = h('input', { type: 'checkbox', id: `l-req-${lesson.id}` });
      required.checked = Boolean(lesson.is_required);

      const msg = h('p', { class: 'field-error', role: 'status', style: 'margin: 0;' });
      const saveBtn = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' }, 'Sove');
      const upBtn = h('button', { class: 'btn btn-quiet btn-sm', type: 'button', disabled: index === 0 }, '↑');
      const downBtn = h('button', { class: 'btn btn-quiet btn-sm', type: 'button', disabled: index === course.lessons.length - 1 }, '↓');
      const deleteBtn = h('button', { class: 'btn btn-danger btn-sm', type: 'button' }, 'Retire');

      upBtn.addEventListener('click', () => moveLesson(lesson.id, -1));
      downBtn.addEventListener('click', () => moveLesson(lesson.id, 1));

      deleteBtn.addEventListener('click', async () => {
        if (!confirm(`Retire leson "${lesson.title}"? Pwogrè anplwaye yo sou li ap disparèt.`)) return;
        deleteBtn.disabled = true;
        try {
          await api.del(`/api/training/lessons/${lesson.id}`);
          await load();
        } catch (err) {
          msg.textContent = errorMessage(err);
          deleteBtn.disabled = false;
        }
      });

      saveBtn.addEventListener('click', async () => {
        msg.textContent = '';
        const changes = {};
        if (title.value.trim() !== lesson.title) changes.title = title.value.trim();
        if ((video.value.trim() || null) !== (lesson.video_url ?? null)) changes.video_url = video.value.trim() || null;
        if ((desc.value.trim() || null) !== (lesson.description ?? null)) changes.description = desc.value.trim() || null;
        const durVal = duration.value.trim() ? Number(duration.value) : null;
        if (durVal !== (lesson.duration_seconds ?? null)) changes.duration_seconds = durVal;
        if (required.checked !== Boolean(lesson.is_required)) changes.is_required = required.checked;

        if (!Object.keys(changes).length) {
          msg.className = 'hint';
          msg.textContent = 'Pa gen anyen ki chanje.';
          return;
        }

        saveBtn.disabled = true;
        try {
          await api.patch(`/api/training/lessons/${lesson.id}`, changes);
          await load();
        } catch (err) {
          msg.className = 'field-error';
          msg.textContent = errorMessage(err);
          saveBtn.disabled = false;
        }
      });

      return h('div', {
        style: 'padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); display: grid; gap: 10px;',
      },
        h('div', { style: 'display: flex; gap: 10px; align-items: center;' },
          h('span', { class: 'sub-label', style: 'margin: 0;' }, `#${index + 1}`),
          h('div', { style: 'flex: 1;' }, title),
          upBtn, downBtn,
        ),
        h('div', { class: 'form-row' },
          field('Lyen videyo', video),
          field('Dire (segonn)', duration, durationLabel(lesson.duration_seconds) !== '—' ? `≈ ${durationLabel(lesson.duration_seconds)}` : null),
        ),
        field('Deskripsyon (opsyonèl)', desc),
        h('div', { style: 'display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;' },
          h('label', {}, h('span', { class: 'check' }, required, ' Obligatwa pou fini kou a')),
          h('div', { style: 'display: flex; gap: 8px;' }, saveBtn, deleteBtn),
        ),
        msg,
      );
    }

    function addLessonForm() {
      const title = input('new-l-title', '', { placeholder: 'Tit leson an', maxlength: '200' });
      const video = input('new-l-video', '', { placeholder: 'https://...mp4 oswa lyen YouTube' });
      const duration = input('new-l-dur', '', { type: 'number', min: '0', placeholder: 'segonn' });
      const required = h('input', { type: 'checkbox', id: 'new-l-req' });
      required.checked = true;
      const msg = h('p', { class: 'field-error', role: 'status' });
      const addBtn = h('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'Ajoute leson');

      addBtn.addEventListener('click', async () => {
        msg.textContent = '';
        if (title.value.trim().length < 2) {
          msg.textContent = 'Mete yon tit pou leson an.';
          return;
        }
        addBtn.disabled = true;
        try {
          await api.post(`/api/training/courses/${id}/lessons`, {
            title: title.value.trim(),
            video_url: video.value.trim() || null,
            duration_seconds: duration.value.trim() ? Number(duration.value) : null,
            is_required: required.checked,
            order_index: 0,
          });
          await load();
        } catch (err) {
          msg.textContent = errorMessage(err);
          addBtn.disabled = false;
        }
      });

      return h('div', { style: 'padding-top: 16px; border-top: 1px solid var(--line); display: grid; gap: 10px;' },
        h('p', { class: 'sub-label' }, 'Ajoute yon nouvo leson'),
        h('div', { class: 'form-row' }, field('Tit', title), field('Lyen videyo', video)),
        h('div', { class: 'form-row' },
          field('Dire (segonn)', duration),
          h('label', { style: 'align-self: end; padding-bottom: 10px;' }, h('span', { class: 'check' }, required, ' Obligatwa')),
        ),
        msg,
        h('div', {}, addBtn),
      );
    }

    // -------------------------------------------------------------------
    // ASIYE BAY ANPLWAYE
    // -------------------------------------------------------------------

    function assignPanel() {
      if (!course.is_published) {
        return h('section', { class: 'panel', style: 'margin-top: 20px;' },
          h('div', { class: 'panel-head' }, h('h2', {}, 'Asiye kou a')),
          h('p', { class: 'hint' }, 'Pibliye kou a anvan ou ka asiye l bay anplwaye.'),
        );
      }

      const search = input('assign-search', '', { type: 'search', placeholder: 'Chèche pa non oswa nimewo' });
      const list = h('div', { style: 'display: grid; gap: 4px; max-height: 260px; overflow-y: auto; margin-top: 10px;' },
        h('p', { class: 'loading' }, 'Ap chaje…'));
      const dueDate = input('assign-due', '', { type: 'date' });
      const msg = h('p', { role: 'status' });
      const assignBtn = h('button', { class: 'btn btn-primary btn-sm', type: 'button' }, 'Asiye moun ki chwazi yo');

      async function loadEmployees(q) {
        list.replaceChildren(h('p', { class: 'loading' }, 'Ap chaje…'));
        try {
          const params = new URLSearchParams({ size: '100' });
          if (q) params.set('q', q);
          const data = await api.get(`/api/employees?${params}`);
          employees = data.items;
          if (!employees.length) {
            list.replaceChildren(h('p', { class: 'empty' }, 'Pa gen anplwaye ki koresponn.'));
            return;
          }
          list.replaceChildren(...employees.map((emp) => {
            const cb = h('input', { type: 'checkbox' });
            cb.checked = selectedEmployeeIds.has(emp.id);
            cb.addEventListener('change', () => {
              if (cb.checked) selectedEmployeeIds.add(emp.id);
              else selectedEmployeeIds.delete(emp.id);
            });
            return h('label', { class: 'check', style: 'padding: 4px 0;' },
              cb, ` ${emp.first_name} ${emp.last_name} (${emp.employee_number})`);
          }));
        } catch (err) {
          list.replaceChildren(h('p', { class: 'empty' }, errorMessage(err)));
        }
      }

      let searchTimer;
      search.addEventListener('input', () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => loadEmployees(search.value.trim()), 300);
      });

      assignBtn.addEventListener('click', async () => {
        msg.className = '';
        msg.textContent = '';
        if (!selectedEmployeeIds.size) {
          msg.className = 'field-error';
          msg.textContent = 'Chwazi omwen yon anplwaye.';
          return;
        }
        assignBtn.disabled = true;
        try {
          const result = await api.post('/api/training/enrollments', {
            course_id: id,
            employee_ids: [...selectedEmployeeIds],
            due_date: dueDate.value || null,
          });
          msg.className = 'hint';
          msg.textContent = `${result.enrolled} moun asiye. ${result.already_enrolled} te deja asiye.`;
          selectedEmployeeIds.clear();
          await loadEmployees(search.value.trim());
          loadReport();
        } catch (err) {
          msg.className = 'field-error';
          msg.textContent = errorMessage(err);
        } finally {
          assignBtn.disabled = false;
        }
      });

      loadEmployees('');

      return h('section', { class: 'panel', style: 'margin-top: 20px;' },
        h('div', { class: 'panel-head' }, h('h2', {}, 'Asiye kou a')),
        search,
        list,
        h('div', { class: 'form-row', style: 'margin-top: 12px;' }, field('Delè (opsyonèl)', dueDate)),
        msg,
        h('div', { style: 'margin-top: 10px;' }, assignBtn),
      );
    }

    // -------------------------------------------------------------------
    // RAPÒ
    // -------------------------------------------------------------------

    function reportPanel() {
      const body = h('div', {}, h('p', { class: 'loading' }, 'Ap chaje…'));
      const el = h('section', { class: 'panel', style: 'margin-top: 20px;' },
        h('div', { class: 'panel-head' }, h('h2', {}, 'Kiyès ki asiye')),
        body,
      );
      el._body = body;
      reportPanel._el = el;
      return el;
    }

    async function loadReport() {
      const el = reportPanel._el;
      if (!el) return;
      try {
        const r = await api.get(`/api/training/courses/${id}/report`);
        if (!r.total_enrolled) {
          el._body.replaceChildren(h('p', { class: 'empty' }, 'Pesonn poko asiye nan kou sa a.'));
          return;
        }
        const stat = (n, t) => h('div', { class: 'stat' }, h('div', { class: 'n' }, String(n)), h('div', { class: 't' }, t));
        el._body.replaceChildren(
          h('div', { class: 'stat-line' },
            stat(r.total_enrolled, 'asiye'),
            stat(r.completed, 'fini'),
            stat(r.in_progress, 'ap fèt'),
            stat(r.not_started, 'poko kòmanse'),
            stat(r.overdue, 'an reta'),
            stat(`${r.completion_rate}%`, 'to konplete'),
          ),
          h('div', { class: 'table-wrap flush', style: 'margin-top: 16px;' },
            h('table', { class: 'table' },
              h('thead', {}, h('tr', {},
                h('th', { scope: 'col' }, 'Anplwaye'),
                h('th', { scope: 'col', class: 'num-col' }, 'Pwogrè'),
                h('th', { scope: 'col', class: 'hide-sm' }, 'Delè'),
                h('th', { scope: 'col', class: 'hide-sm' }, 'Fini'),
                h('th', { scope: 'col', class: 'num-col hide-sm' }, 'Nòt'),
              )),
              h('tbody', {}, ...r.rows.map((row) => h('tr', {},
                h('td', {},
                  h('div', { class: 'who' }, row.employee_name),
                  h('div', { class: 'num' }, row.employee_number),
                ),
                h('td', { class: 'num-col' }, `${row.progress_percent}%`),
                h('td', { class: 'cell-muted hide-sm' },
                  row.due_date ? fmt.shortDate(row.due_date) : '—',
                  row.is_overdue ? h('span', { class: 'badge badge-late', style: 'margin-left: 6px;' }, 'An reta') : null,
                ),
                h('td', { class: 'cell-muted hide-sm' }, row.completed_at ? fmt.shortDate(row.completed_at) : '—'),
                h('td', { class: 'num-col cell-muted hide-sm' }, row.score ?? '—'),
              ))),
            ),
          ),
        );
      } catch (err) {
        el._body.replaceChildren(h('p', { class: 'empty' }, errorMessage(err)));
      }
    }

    load();
  })();
  </script>
</body>
</html>
