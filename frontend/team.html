<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Ekip mwen — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="page-head">
          <h1 data-i18n>Ekip mwen</h1>
          <p id="subtitle" data-i18n>Apwouve demann yo epi evalye travay ekip ou.</p>
        </div>

        <div id="leaves"></div>
        <div id="reviews"></div>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, fmt, h, ApiError, shell, t } = Konbit;

    const identity = await shell.mount('team', shell.MANAGERS);
    if (!identity) return;

    const isHr = ['super_admin', 'org_admin', 'hr'].includes(identity.user.role);
    const leavesBox = document.getElementById('leaves');
    const reviewsBox = document.getElementById('reviews');

    // -------------------------------------------------------------------
    // ZOUTI
    // -------------------------------------------------------------------

    function errorMessage(err) {
      let msg = err instanceof ApiError ? err.message : t('Yon bagay pa mache.');
      if (err && err.fields && err.fields.length) {
        msg += ' ' + err.fields.map((f) => `${f.field}: ${f.message}`).join('; ');
      }
      return msg;
    }

    function panel(title, meta, ...children) {
      return h('section', { class: 'panel', style: 'margin-top: 20px;' },
        h('div', { class: 'panel-head' },
          h('h2', {}, title),
          meta !== null && meta !== undefined ? h('span', { class: 'meta' }, String(meta)) : null,
        ),
        ...children,
      );
    }

    function field(label, inputEl, hint) {
      return h('div', { class: 'field' },
        h('label', { for: inputEl.id }, label),
        inputEl,
        hint ? h('span', { class: 'hint' }, hint) : null,
      );
    }

    function input(id, value, attrs = {}) {
      const el = h('input', { class: 'input', id, autocomplete: 'off', ...attrs });
      el.value = value ?? '';
      return el;
    }

    function textarea(id, value, attrs = {}) {
      const el = h('textarea', { class: 'textarea', id, rows: '3', ...attrs });
      el.value = value ?? '';
      return el;
    }

    function select(id, options, value) {
      const el = h('select', { class: 'select', id },
        ...options.map(([v, label]) => h('option', { value: v }, label)));
      if (value !== undefined && value !== null) el.value = String(value);
      return el;
    }

    function personName(id) {
      return shell.cachedName(id) || t('Anplwaye #{id}', { id });
    }

    /** "Fòs:" + tèks la, oswa anyen si pa gen tèks. */
    function labeled(label, text) {
      if (!text) return null;
      return h('div', {}, h('span', { class: 'sub' }, `${label} `), text);
    }

    // -------------------------------------------------------------------
    // DEMANN KONJE K AP TANN
    // -------------------------------------------------------------------

    function leaveCard(item) {
      const r = item.request;
      const msg = h('p', { class: 'field-error', role: 'status', style: 'margin: 0;' });
      const note = input(`note-${r.id}`, '', {
        maxlength: '500',
        placeholder: t('Nòt (opsyonèl)'),
        'aria-label': t('Nòt pou {name}', { name: item.employee_name }),
      });

      async function decide(approve, btn) {
        if (!approve && !note.value.trim()
            && !confirm(t('Refize san nòt? Li pi bon pou di moun nan poukisa.'))) return;
        btn.disabled = true;
        msg.textContent = '';
        try {
          await api.post(`/api/leaves/${r.id}/decide`, {
            approve, note: note.value.trim() || null,
          });
          await loadLeaves();
        } catch (err) {
          msg.textContent = errorMessage(err);
          btn.disabled = false;
        }
      }

      const approveBtn = h('button', { class: 'btn btn-primary btn-sm', type: 'button' }, t('Apwouve|aksyon'));
      const rejectBtn = h('button', { class: 'btn btn-danger btn-sm', type: 'button' }, t('Refize|aksyon'));
      approveBtn.addEventListener('click', () => decide(true, approveBtn));
      rejectBtn.addEventListener('click', () => decide(false, rejectBtn));

      return h('div', {
        style: 'padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); display: grid; gap: 8px;',
      },
        h('div', { style: 'display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;' },
          h('strong', {}, `${item.employee_name} · ${item.employee_number}`),
          h('span', { class: 'badge badge-pending' }, fmt.leaveType(r.leave_type)),
        ),
        h('div', { class: 'sub' },
          `${fmt.date(r.start_date)} → ${fmt.date(r.end_date)} · `
          + t('{days} jou travay', { days: Number(r.total_days) })),
        r.reason ? h('div', { style: 'white-space: pre-wrap;' }, r.reason) : null,
        h('div', { style: 'display: flex; gap: 8px; flex-wrap: wrap; align-items: center;' },
          note, approveBtn, rejectBtn),
        msg,
      );
    }

    async function loadLeaves() {
      const title = t('Demann konje k ap tann');
      try {
        const data = await api.get('/api/leaves/pending');
        leavesBox.replaceChildren(panel(title, data.total,
          data.items.length
            ? h('div', { style: 'display: grid; gap: 12px;' }, ...data.items.map(leaveCard))
            : h('p', { class: 'empty' }, t('Pa gen okenn demann k ap tann ou.')),
        ));
      } catch (err) {
        leavesBox.replaceChildren(panel(title, null, h('p', { class: 'empty' }, errorMessage(err))));
      }
    }

    // -------------------------------------------------------------------
    // EVALYASYON
    // -------------------------------------------------------------------

    function reviewRow(r) {
      const msg = h('span', { class: 'field-error', role: 'status' });
      const done = Boolean(r.finalized_at);
      let action = null;

      if (!done) {
        action = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' }, t('Finalize|aksyon'));
        action.addEventListener('click', async () => {
          if (!confirm(t('Finalize evalyasyon {name} an? Apre sa, li p ap ka chanje ankò, e anplwaye a ap ka wè l.',
            { name: personName(r.employee_id) }))) return;
          action.disabled = true;
          try {
            await api.post(`/api/feedback/reviews/${r.id}/finalize`);
            await loadReviews();
          } catch (err) {
            msg.textContent = errorMessage(err);
            action.disabled = false;
          }
        });
      }

      return h('div', {
        style: 'padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); display: grid; gap: 6px;',
      },
        h('div', { style: 'display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;' },
          h('strong', {}, r.period_label ? `${personName(r.employee_id)} · ${r.period_label}` : personName(r.employee_id)),
          done ? h('span', { class: 'badge badge-approved' }, t('Finalize|estati'))
               : h('span', { class: 'badge badge-pending' }, t('Bouyon')),
        ),
        h('div', { class: 'sub' },
          r.overall_score
            ? t('Nòt jeneral: {stars} ({score}/5)', { stars: '★'.repeat(r.overall_score), score: r.overall_score })
            : t('Poko gen nòt')),
        labeled(t('Fòs:'), r.strengths),
        labeled(t('Pou amelyore:'), r.improvements),
        labeled(t('Objektif:'), r.goals),
        labeled(t('Repons anplwaye a:'), r.employee_comment),
        h('div', { style: 'display: flex; gap: 8px; align-items: center;' }, action, msg),
      );
    }

    function reviewForm() {
      const msg = h('p', { class: 'field-error', role: 'status' });
      // Pèsonn pa evalye tèt li: nou retire moun ki konekte a nan rezilta yo.
      // Pou yon manadjè, API a bay sèlman moun ki anba l.
      const myEmpId = identity.employee_id || null;
      const who = shell.employeePicker({ id: 'rv-who', excludeIds: myEmpId ? [myEmpId] : [] });
      const label = input('rv-label', '', { maxlength: '100', placeholder: t('Egz: 2026 — 2yèm semès') });
      const start = input('rv-start', '', { type: 'date' });
      const end = input('rv-end', '', { type: 'date' });
      const score = select('rv-score',
        [['', '—'], ...[1, 2, 3, 4, 5].map((n) => [String(n), `${'★'.repeat(n)} (${n}/5)`])], '');
      const strengths = textarea('rv-strengths', '');
      const improvements = textarea('rv-improvements', '');
      const goals = textarea('rv-goals', '');
      const submit = h('button', { class: 'btn btn-primary btn-sm', type: 'submit' }, t('Sove bouyon an'));

      const form = h('form', { novalidate: true, style: 'display: grid; gap: 12px; margin-top: 18px;' },
        h('p', { class: 'sub-label' }, t('Nouvo evalyasyon')),
        h('div', { style: 'display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;' },
          h('div', { class: 'field' }, h('label', { for: 'rv-who' }, t('Anplwaye')), who.el),
          field(t('Peryòd'), label),
          field(t('Kòmansman'), start),
          field(t('Fen'), end),
          field(t('Nòt jeneral'), score, t('Obligatwa pou finalize.')),
        ),
        field(t('Fòs li'), strengths),
        field(t('Sa pou l amelyore'), improvements),
        field(t('Objektif pou pwochen peryòd la'), goals),
        msg, h('div', {}, submit),
      );

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        if (!who.value) { msg.textContent = t('Chwazi anplwaye a.'); return; }
        if (!label.value.trim()) { msg.textContent = t('Bay peryòd la yon non.'); return; }
        if (start.value && end.value && end.value < start.value) {
          msg.textContent = t('Fen peryòd la pa ka anvan kòmansman an.');
          return;
        }
        submit.disabled = true;
        try {
          await api.post('/api/feedback/reviews', {
            employee_id: who.value,
            period_label: label.value.trim(),
            period_start: start.value || null,
            period_end: end.value || null,
            overall_score: score.value ? Number(score.value) : null,
            strengths: strengths.value.trim() || null,
            improvements: improvements.value.trim() || null,
            goals: goals.value.trim() || null,
          });
          await loadReviews();
        } catch (err) {
          msg.textContent = errorMessage(err);
          submit.disabled = false;
        }
      });

      return form;
    }

    async function loadReviews() {
      const title = t('Evalyasyon');
      try {
        const data = await api.get('/api/feedback/reviews/team');
        await shell.employeeNames(data.items.map((r) => r.employee_id));
        const list = data.items.length
          ? h('div', { style: 'display: grid; gap: 12px;' }, ...data.items.map(reviewRow))
          : h('p', { class: 'empty' }, t('Poko gen evalyasyon.'));
        reviewsBox.replaceChildren(panel(title, data.total,
          h('p', { class: 'hint', style: 'display: block; margin: 0 0 14px;' },
            t('Yon bouyon rete prive. Lè w finalize l, anplwaye a ka wè l epi reponn.')),
          list,
          reviewForm(),
        ));
      } catch (err) {
        reviewsBox.replaceChildren(panel(title, null, h('p', { class: 'empty' }, errorMessage(err))));
      }
    }

    // -------------------------------------------------------------------
    // DEMARAJ
    // -------------------------------------------------------------------

    if (isHr) {
      document.getElementById('subtitle').textContent =
        t('Tout demann ki ap tann nan biznis la, ak evalyasyon yo.');
    }

    await Promise.all([loadLeaves(), loadReviews()]);
  })();
  </script>
</body>
</html>
