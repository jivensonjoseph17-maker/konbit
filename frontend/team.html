<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Ekip mwen — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    /* --- Chif anlè yo --- */
    .team-kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
    .kpi .k-label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .kpi .k-value { font-size: 28px; font-weight: 800; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .kpi.warn .k-value { color: #b45309; }
    .kpi.bad .k-value { color: #dc2626; }
    @media (max-width: 1000px) { .team-kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 560px) { .team-kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    /* --- Bouton seksyon yo (menm ak tablo de bò a) --- */
    .dash-tabs {
      display: flex; gap: 6px; padding: 6px; margin-bottom: 18px; overflow-x: auto;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px; scrollbar-width: none;
    }
    .dash-tabs::-webkit-scrollbar { display: none; }
    .dash-tab {
      display: inline-flex; align-items: center; gap: 8px; flex: none;
      padding: 10px 16px; border: 0; border-radius: 10px; cursor: pointer;
      background: transparent; color: var(--muted); font: inherit; font-size: 14.5px; font-weight: 600; white-space: nowrap;
    }
    .dash-tab svg { width: 18px; height: 18px; flex: none; }
    .dash-tab:hover { color: var(--text); background: var(--surface-2, rgba(148, 163, 184, 0.12)); }
    .dash-tab[aria-selected="true"] { background: var(--accent, #2563eb); color: #fff; }
    .dash-tab:focus-visible { outline: 2px solid var(--accent, #2563eb); outline-offset: 2px; }
    .tab-count {
      min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; font-size: 12px; font-weight: 700;
      display: inline-flex; align-items: center; justify-content: center; background: #e5484d; color: #fff;
    }
    .tab-panel { display: grid; gap: 18px; }

    /* --- Lis ekip la --- */
    .member { display: flex; align-items: center; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
    .member:first-child { border-top: 0; }
    .member .info { flex: 1; min-width: 0; }
    .member .name { font-weight: 700; }
    .member .detail { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
    .member .tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .card { padding: 14px; border: 1px solid var(--line); border-radius: var(--radius-sm, 10px); display: grid; gap: 8px; }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="page-head">
          <h1 data-i18n>Ekip mwen</h1>
          <p id="subtitle" data-i18n>Apwouve demann yo epi evalye travay ekip ou.</p>
        </div>

        <div id="kpis"></div>
        <div id="tabs"></div>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, fmt, h, ApiError, shell, t } = Konbit;

    const identity = await shell.mount('team', shell.MANAGERS);
    if (!identity) return;

    const isHr = ['super_admin', 'org_admin', 'hr'].includes(identity.user.role);

    // -------------------------------------------------------------------
    // ZOUTI
    // -------------------------------------------------------------------

    function errorMessage(err) {
      let msg = err instanceof ApiError ? err.message : t('Yon bagay pa mache.');
      if (err && err.fields && err.fields.length) {
        msg += ' ' + err.fields.map((f) => `${f.field}: ${f.message}`).join('; ');
      }
      return msg;
    }

    function panel(title, meta, ...children) {
      return h('section', { class: 'panel' },
        h('div', { class: 'panel-head' },
          h('h2', {}, title),
          meta !== null && meta !== undefined ? h('span', { class: 'meta' }, String(meta)) : null,
        ),
        ...children,
      );
    }

    function field(label, inputEl, hint) {
      return h('div', { class: 'field' },
        h('label', { for: inputEl.id }, label),
        inputEl,
        hint ? h('span', { class: 'hint' }, hint) : null,
      );
    }

    function input(id, value, attrs = {}) {
      const el = h('input', { class: 'input', id, autocomplete: 'off', ...attrs });
      el.value = value ?? '';
      return el;
    }

    function textarea(id, value, attrs = {}) {
      const el = h('textarea', { class: 'textarea', id, rows: '3', ...attrs });
      el.value = value ?? '';
      return el;
    }

    function select(id, options, value) {
      const el = h('select', { class: 'select', id },
        ...options.map(([v, label]) => h('option', { value: v }, label)));
      if (value !== undefined && value !== null) el.value = String(value);
      return el;
    }

    function personName(id) {
      return shell.cachedName(id) || t('Anplwaye #{id}', { id });
    }

    function labeled(label, text) {
      if (!text) return null;
      return h('div', {}, h('span', { class: 'sub' }, `${label} `), text);
    }

    // -------------------------------------------------------------------
    // ESTATI JODI A — tèks yo dirèkteman anndan t() pou check_i18n.py
    // -------------------------------------------------------------------

    const STATUS = {
      working: () => [t('Nan travay'), 'badge-approved'],
      done: () => [t('Fini|jounen'), 'badge-cancelled'],
      missing_out: () => [t('San klòk out'), 'badge-late'],
      on_leave: () => [t('An konje'), 'badge-pending'],
      absent: () => [t('Absan'), 'badge-rejected'],
      not_yet: () => [t('Poko antre'), 'badge-cancelled'],
      off: () => [t('Repo|orè'), 'badge-cancelled'],
      no_record: () => [t('Poko antre'), 'badge-cancelled'],
    };

    function badge(status) {
      const [label, cls] = STATUS[status] ? STATUS[status]() : [status, ''];
      return h('span', { class: `badge ${cls}` }, label);
    }

    // -------------------------------------------------------------------
    // CHIF ANLÈ YO + JODI A
    // -------------------------------------------------------------------

    const kpiBox = document.getElementById('kpis');
    const todayBody = h('div', {}, h('p', { class: 'loading' }, t('Ap chaje…')));
    let todayTimer = null;

    function kpi(label, value, cls) {
      return h('div', { class: `kpi ${cls || ''}` },
        h('div', { class: 'k-label' }, label),
        h('div', { class: 'k-value' }, String(value)));
    }

    function memberRow(m) {
      const bits = [];
      if (m.shift_start) bits.push(`${t('Orè')}: ${m.shift_start}–${m.shift_end}`);
      if (m.clock_in_at) {
        bits.push(`${fmt.time(m.clock_in_at)} → ${m.clock_out_at ? fmt.time(m.clock_out_at) : '…'}`);
      }
      if (m.worked_minutes != null) bits.push(fmt.duration(m.worked_minutes));
      if (m.leave_type) bits.push(fmt.leaveType(m.leave_type));

      return h('div', { class: 'member' },
        h('span', { class: 'avatar', 'aria-hidden': 'true' }, shell.initials(m.employee_name)),
        h('div', { class: 'info' },
          h('a', { class: 'name plain-link', href: `employee.html?id=${m.employee_id}` }, m.employee_name),
          h('div', { class: 'detail' }, [m.employee_number, ...bits].join(' · ')),
        ),
        h('div', { class: 'tags' },
          m.late ? h('span', { class: 'badge badge-late' }, t('An reta')) : null,
          badge(m.status),
        ),
      );
    }

    async function loadToday() {
      clearTimeout(todayTimer);
      try {
        const d = await api.get('/api/team/today');
        const c = d.counts;
        kpiBox.replaceChildren(h('div', { class: 'team-kpis' },
          kpi(t('Antre jodi a'), c.working + c.done + c.missing_out),
          kpi(t('Nan travay'), c.working),
          kpi(t('An reta'), d.late_count, d.late_count ? 'warn' : ''),
          kpi(t('Absan'), c.absent, c.absent ? 'bad' : ''),
          kpi(t('An konje'), c.on_leave),
        ));

        // Moun ki bezwen atansyon an premye: absan, an reta, san klòk out.
        const order = { absent: 0, missing_out: 1, working: 2, not_yet: 3, done: 4, on_leave: 5, no_record: 6, off: 7 };
        const items = [...d.items].sort((a, b) =>
          (order[a.status] - order[b.status]) || (Number(b.late) - Number(a.late)));

        todayBody.replaceChildren(items.length
          ? h('div', {}, ...items.map(memberRow))
          : h('p', { class: 'empty' }, t('Pa gen pesonn nan ekip ou.')));
      } catch (err) {
        todayBody.replaceChildren(h('p', { class: 'empty' }, errorMessage(err)));
      }
      todayTimer = setTimeout(loadToday, 60000);
    }

    function todaySection() {
      return panel(t('Ekip mwen jodi a'), fmt.longDate(new Date()), todayBody);
    }

    // -------------------------------------------------------------------
    // POU APWOUVE — konje + èdtan
    // -------------------------------------------------------------------

    const approvalsBox = h('div', { class: 'tab-panel' });

    function leaveCard(item, reload) {
      const r = item.request;
      const msg = h('p', { class: 'field-error', role: 'status', style: 'margin: 0;' });
      const note = input(`note-${r.id}`, '', {
        maxlength: '500',
        placeholder: t('Nòt (opsyonèl)'),
        'aria-label': t('Nòt pou {name}', { name: item.employee_name }),
      });

      async function decide(approve, btn) {
        if (!approve && !note.value.trim()
            && !confirm(t('Refize san nòt? Li pi bon pou di moun nan poukisa.'))) return;
        btn.disabled = true;
        msg.textContent = '';
        try {
          await api.post(`/api/leaves/${r.id}/decide`, { approve, note: note.value.trim() || null });
          await reload();
        } catch (err) {
          msg.textContent = errorMessage(err);
          btn.disabled = false;
        }
      }

      const approveBtn = h('button', { class: 'btn btn-primary btn-sm', type: 'button' }, t('Apwouve|aksyon'));
      const rejectBtn = h('button', { class: 'btn btn-danger btn-sm', type: 'button' }, t('Refize|aksyon'));
      approveBtn.addEventListener('click', () => decide(true, approveBtn));
      rejectBtn.addEventListener('click', () => decide(false, rejectBtn));

      return h('div', { class: 'card' },
        h('div', { style: 'display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;' },
          h('strong', {}, `${item.employee_name} · ${item.employee_number}`),
          h('span', { class: 'badge badge-pending' }, fmt.leaveType(r.leave_type)),
        ),
        h('div', { class: 'sub' },
          `${fmt.date(r.start_date)} → ${fmt.date(r.end_date)} · `
          + t('{days} jou travay', { days: Number(r.total_days) })),
        r.reason ? h('div', { style: 'white-space: pre-wrap;' }, r.reason) : null,
        h('div', { style: 'display: flex; gap: 8px; flex-wrap: wrap; align-items: center;' },
          note, approveBtn, rejectBtn),
        msg,
      );
    }

    async function loadApprovals() {
      const [leaves, count] = await Promise.allSettled([
        api.get('/api/leaves/pending'),
        api.get('/api/team/inbox-count'),
      ]);

      const leavePanel = leaves.status === 'fulfilled'
        ? panel(t('Demann konje k ap tann'), leaves.value.total,
            leaves.value.items.length
              ? h('div', { style: 'display: grid; gap: 12px;' },
                  ...leaves.value.items.map((it) => leaveCard(it, refreshApprovals)))
              : h('p', { class: 'empty' }, t('Pa gen okenn demann k ap tann ou.')))
        : panel(t('Demann konje k ap tann'), null, h('p', { class: 'empty' }, errorMessage(leaves.reason)));

      let hoursContent = h('p', { class: 'empty' }, t('Pa gen èdtan k ap tann ou.'));
      let hoursCount = 0;
      if (count.status === 'fulfilled' && count.value.timesheets) {
        hoursCount = count.value.timesheets;
        hoursContent = h('div', { class: 'card' },
          h('div', {}, t('{n} moun gen èdtan pou apwouve pou {period}.',
            { n: count.value.timesheets, period: count.value.period_name || '' })),
          h('div', {}, h('a', { class: 'btn btn-primary btn-sm', href: 'timesheets.html' }, t('Ale nan Tan travay'))),
        );
      }

      approvalsBox.replaceChildren(
        leavePanel,
        panel(t('Èdtan pou apwouve'), hoursCount, hoursContent),
      );
      return count.status === 'fulfilled' ? count.value.total : 0;
    }

    // -------------------------------------------------------------------
    // EVALYASYON (menm jan ak anvan)
    // -------------------------------------------------------------------

    const reviewsBox = h('div', {});

    function reviewRow(r) {
      const msg = h('span', { class: 'field-error', role: 'status' });
      const done = Boolean(r.finalized_at);
      let action = null;

      if (!done) {
        action = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' }, t('Finalize|aksyon'));
        action.addEventListener('click', async () => {
          if (!confirm(t('Finalize evalyasyon {name} an? Apre sa, li p ap ka chanje ankò, e anplwaye a ap ka wè l.',
            { name: personName(r.employee_id) }))) return;
          action.disabled = true;
          try {
            await api.post(`/api/feedback/reviews/${r.id}/finalize`);
            await loadReviews();
          } catch (err) {
            msg.textContent = errorMessage(err);
            action.disabled = false;
          }
        });
      }

      return h('div', { class: 'card', style: 'gap: 6px;' },
        h('div', { style: 'display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap;' },
          h('strong', {}, r.period_label ? `${personName(r.employee_id)} · ${r.period_label}` : personName(r.employee_id)),
          done ? h('span', { class: 'badge badge-approved' }, t('Finalize|estati'))
               : h('span', { class: 'badge badge-pending' }, t('Bouyon')),
        ),
        h('div', { class: 'sub' },
          r.overall_score
            ? t('Nòt jeneral: {stars} ({score}/5)', { stars: '★'.repeat(r.overall_score), score: r.overall_score })
            : t('Poko gen nòt')),
        labeled(t('Fòs:'), r.strengths),
        labeled(t('Pou amelyore:'), r.improvements),
        labeled(t('Objektif:'), r.goals),
        labeled(t('Repons anplwaye a:'), r.employee_comment),
        h('div', { style: 'display: flex; gap: 8px; align-items: center;' }, action, msg),
      );
    }

    function reviewForm() {
      const msg = h('p', { class: 'field-error', role: 'status' });
      const myEmpId = identity.employee_id || null;
      const who = shell.employeePicker({ id: 'rv-who', excludeIds: myEmpId ? [myEmpId] : [] });
      const label = input('rv-label', '', { maxlength: '100', placeholder: t('Egz: 2026 — 2yèm semès') });
      const start = input('rv-start', '', { type: 'date' });
      const end = input('rv-end', '', { type: 'date' });
      const score = select('rv-score',
        [['', '—'], ...[1, 2, 3, 4, 5].map((n) => [String(n), `${'★'.repeat(n)} (${n}/5)`])], '');
      const strengths = textarea('rv-strengths', '');
      const improvements = textarea('rv-improvements', '');
      const goals = textarea('rv-goals', '');
      const submit = h('button', { class: 'btn btn-primary btn-sm', type: 'submit' }, t('Sove bouyon an'));

      const form = h('form', { novalidate: true, style: 'display: grid; gap: 12px; margin-top: 18px;' },
        h('p', { class: 'sub-label' }, t('Nouvo evalyasyon')),
        h('div', { style: 'display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;' },
          h('div', { class: 'field' }, h('label', { for: 'rv-who' }, t('Anplwaye')), who.el),
          field(t('Peryòd'), label),
          field(t('Kòmansman'), start),
          field(t('Fen'), end),
          field(t('Nòt jeneral'), score, t('Obligatwa pou finalize.')),
        ),
        field(t('Fòs li'), strengths),
        field(t('Sa pou l amelyore'), improvements),
        field(t('Objektif pou pwochen peryòd la'), goals),
        msg, h('div', {}, submit),
      );

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        if (!who.value) { msg.textContent = t('Chwazi anplwaye a.'); return; }
        if (!label.value.trim()) { msg.textContent = t('Bay peryòd la yon non.'); return; }
        if (start.value && end.value && end.value < start.value) {
          msg.textContent = t('Fen peryòd la pa ka anvan kòmansman an.');
          return;
        }
        submit.disabled = true;
        try {
          await api.post('/api/feedback/reviews', {
            employee_id: who.value,
            period_label: label.value.trim(),
            period_start: start.value || null,
            period_end: end.value || null,
            overall_score: score.value ? Number(score.value) : null,
            strengths: strengths.value.trim() || null,
            improvements: improvements.value.trim() || null,
            goals: goals.value.trim() || null,
          });
          await loadReviews();
        } catch (err) {
          msg.textContent = errorMessage(err);
          submit.disabled = false;
        }
      });

      return form;
    }

    async function loadReviews() {
      const title = t('Evalyasyon');
      try {
        const data = await api.get('/api/feedback/reviews/team');
        await shell.employeeNames(data.items.map((r) => r.employee_id));
        const list = data.items.length
          ? h('div', { style: 'display: grid; gap: 12px;' }, ...data.items.map(reviewRow))
          : h('p', { class: 'empty' }, t('Poko gen evalyasyon.'));
        reviewsBox.replaceChildren(panel(title, data.total,
          h('p', { class: 'hint', style: 'display: block; margin: 0 0 14px;' },
            t('Yon bouyon rete prive. Lè w finalize l, anplwaye a ka wè l epi reponn.')),
          list,
          reviewForm(),
        ));
      } catch (err) {
        reviewsBox.replaceChildren(panel(title, null, h('p', { class: 'empty' }, errorMessage(err))));
      }
    }

    // -------------------------------------------------------------------
    // BOUTON SEKSYON YO — chwa a rete nan #hash la
    // -------------------------------------------------------------------

    const ICONS = {
      users: ['M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1', 'M9 10a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
        'M22 19v-1a4 4 0 0 0-3-3.9', 'M16 4.1a3 3 0 0 1 0 5.8'],
      check: ['M4 12l5 5L20 6'],
      star: ['M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z'],
    };

    function icon(name) {
      const NS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(NS, 'svg');
      for (const [k, v] of Object.entries({
        viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', 'stroke-width': '1.8',
        'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'aria-hidden': 'true',
      })) svg.setAttribute(k, v);
      for (const d of ICONS[name]) {
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        svg.append(path);
      }
      return svg;
    }

    const approvalsCount = h('span', { class: 'tab-count', hidden: true });

    async function refreshApprovals() {
      const total = await loadApprovals();
      approvalsCount.textContent = String(total);
      approvalsCount.hidden = !total;
      shell.refreshInboxBadge();
    }

    const TABS = [
      { id: 'jodi-a', label: t('Jodi a'), icon: 'users', el: todaySection() },
      { id: 'pou-apwouve', label: t('Pou apwouve'), icon: 'check', el: approvalsBox, extra: approvalsCount },
      { id: 'evalyasyon', label: t('Evalyasyon'), icon: 'star', el: reviewsBox },
    ];

    const panelBox = h('div', { class: 'tab-panel', role: 'tabpanel', id: 'team-panel' });
    const buttons = TABS.map((tab) => {
      const btn = h('button', {
        class: 'dash-tab', type: 'button', role: 'tab', id: `tab-${tab.id}`,
        'aria-controls': 'team-panel', 'aria-selected': 'false', tabindex: '-1',
      }, icon(tab.icon), h('span', {}, tab.label), tab.extra || null);
      btn.addEventListener('click', () => select(tab.id, true));
      return btn;
    });

    function select(id, fromClick) {
      const index = Math.max(0, TABS.findIndex((tb) => tb.id === id));
      buttons.forEach((b, i) => {
        b.setAttribute('aria-selected', String(i === index));
        b.tabIndex = i === index ? 0 : -1;
      });
      panelBox.setAttribute('aria-labelledby', `tab-${TABS[index].id}`);
      panelBox.replaceChildren(TABS[index].el);
      if (fromClick) history.replaceState(null, '', `#${TABS[index].id}`);
    }

    const bar = h('div', { class: 'dash-tabs', role: 'tablist', 'aria-label': t('Seksyon yo') }, ...buttons);
    bar.addEventListener('keydown', (e) => {
      if (!['ArrowRight', 'ArrowLeft'].includes(e.key)) return;
      const current = buttons.findIndex((b) => b.getAttribute('aria-selected') === 'true');
      const rtl = document.documentElement.dir === 'rtl';
      const step = (e.key === 'ArrowRight') !== rtl ? 1 : -1;
      const next = (current + step + buttons.length) % buttons.length;
      select(TABS[next].id, true);
      buttons[next].focus();
    });
    window.addEventListener('hashchange', () => select(location.hash.slice(1), false));

    document.getElementById('tabs').append(bar, panelBox);

    // -------------------------------------------------------------------
    // DEMARAJ
    // -------------------------------------------------------------------

    if (isHr) {
      document.getElementById('subtitle').textContent =
        t('Tout demann ki ap tann nan biznis la, ak evalyasyon yo.');
    }

    select(location.hash.slice(1), false);
    await Promise.all([loadToday(), refreshApprovals(), loadReviews()]);
  })();
  </script>
</body>
</html>
