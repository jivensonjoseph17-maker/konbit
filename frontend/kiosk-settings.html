<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="logo.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Pwentaj ak tablèt — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    .mode-options { display: grid; gap: 10px; margin: 12px 0; }
    .mode-option { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
      border: 1px solid var(--line); border-radius: var(--radius-sm, 10px); cursor: pointer; }
    .mode-option input { margin-top: 4px; }
    .mode-option .t { font-weight: 700; }
    .mode-option .d { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .mode-option:has(input:checked) { border-color: var(--accent, #2563eb); }
  </style>
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="page-head">
          <h1 data-i18n>Pwentaj ak tablèt</h1>
          <p data-i18n>Chwazi kote anplwaye yo pwente, epi jere tablèt biznis la.</p>
        </div>

        <!-- Kòd aktivasyon: parèt yon sèl fwa -->
        <section class="secret" id="secret" hidden aria-live="polite">
          <h2 id="secret-title"></h2>
          <p id="secret-note"></p>
          <div class="secret-row">
            <code id="secret-value" style="font-size: 28px; letter-spacing: 0.12em;"></code>
            <button class="btn btn-ghost btn-sm" type="button" id="secret-copy" data-i18n>Kopye</button>
          </div>
        </section>

        <!-- Mòd pwentaj -->
        <section class="panel" aria-labelledby="mode-title">
          <div class="panel-head"><h2 id="mode-title" data-i18n>Kote anplwaye yo pwente</h2></div>
          <div class="mode-options" role="radiogroup" aria-labelledby="mode-title">
            <label class="mode-option">
              <input type="radio" name="mode" value="phone">
              <span>
                <span class="t" data-i18n>Sou telefòn yo</span>
                <span class="d" style="display: block;" data-i18n>Chak anplwaye peze Klòk in sou telefòn li.</span>
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="kiosk">
              <span>
                <span class="t" data-i18n>Sèlman sou tablèt biznis la</span>
                <span class="d" style="display: block;" data-i18n>Anplwaye yo tape nimewo yo ak kòd pèsonèl yo sou tablèt la. Telefòn yo pa ka pwente ankò.</span>
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="both">
              <span>
                <span class="t" data-i18n>Toulède</span>
                <span class="d" style="display: block;" data-i18n>Anplwaye yo ka pwente sou telefòn yo oswa sou tablèt la.</span>
              </span>
            </label>
          </div>
          <p role="status" id="mode-msg"></p>
          <button class="btn btn-primary" type="button" id="mode-save" data-i18n>Anrejistre chanjman yo</button>
        </section>

        <!-- Tablèt yo -->
        <section class="panel" aria-labelledby="dev-title" style="margin-top: 18px;">
          <div class="panel-head"><h2 id="dev-title" data-i18n>Tablèt yo</h2></div>

          <div class="field" style="max-width: 420px;">
            <label for="d-name" data-i18n>Non tablèt la</label>
            <input class="input" id="d-name" maxlength="100" autocomplete="off"
                   data-i18n-attr="placeholder" placeholder="Egz: Tablèt kès la">
          </div>
          <p class="hint" data-i18n>Si w sou tablèt la kounye a, klike «Aktive tablèt sa a»: ou ap dekonekte, epi tablèt la ap louvri paj pwentaj la.</p>
          <p class="field-error" id="d-error" role="alert"></p>
          <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px;">
            <button class="btn btn-primary" type="button" id="d-here" data-i18n>Aktive tablèt sa a</button>
            <button class="btn btn-ghost" type="button" id="d-other" data-i18n>Jenere yon kòd pou yon lòt tablèt</button>
          </div>

          <ul class="list" id="devices" style="margin-top: 18px;">
            <li class="loading" data-i18n>Ap chaje…</li>
          </ul>
        </section>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, fmt, h, shell, t } = Konbit;

    // Backend la: sèlman administratè biznis la (require_admin).
    const identity = await shell.mount('kiosk', ['super_admin', 'org_admin']);
    if (!identity) return;

    const $ = (id) => document.getElementById(id);
    const KIOSK_TOKEN_KEY = 'konbit.kiosk_token';

    // -----------------------------------------------------------------
    // MÒD PWENTAJ
    // -----------------------------------------------------------------

    const radios = () => [...document.querySelectorAll('input[name="mode"]')];

    async function loadMode() {
      try {
        const s = await api.get('/api/kiosk/settings');
        radios().forEach((r) => { r.checked = r.value === s.clock_mode; });
      } catch (err) {
        $('mode-msg').className = 'field-error';
        $('mode-msg').textContent = err.message;
      }
    }

    $('mode-save').addEventListener('click', async () => {
      const chosen = radios().find((r) => r.checked);
      if (!chosen) return;
      const btn = $('mode-save');
      btn.disabled = true;
      $('mode-msg').className = '';
      $('mode-msg').textContent = '';
      try {
        await api.put('/api/kiosk/settings', { clock_mode: chosen.value });
        $('mode-msg').className = 'alert alert-ok';
        $('mode-msg').textContent = t('Chanjman an anrejistre.');
      } catch (err) {
        $('mode-msg').className = 'field-error';
        $('mode-msg').textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });

    // -----------------------------------------------------------------
    // KÒD AKTIVASYON (yon sèl fwa)
    // -----------------------------------------------------------------

    function showSecret(title, value, note) {
      $('secret-title').textContent = title;
      $('secret-value').textContent = value;
      $('secret-note').textContent = note;
      $('secret-copy').textContent = t('Kopye');
      $('secret').hidden = false;
      $('secret').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    $('secret-copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText($('secret-value').textContent);
        $('secret-copy').textContent = t('Kopye ✓');
      } catch {
        const range = document.createRange();
        range.selectNodeContents($('secret-value'));
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
        $('secret-copy').textContent = t('Ctrl+C pou kopye');
      }
    });

    // -----------------------------------------------------------------
    // TABLÈT YO
    // -----------------------------------------------------------------

    async function loadDevices() {
      const list = $('devices');
      try {
        const data = await api.get('/api/kiosk/devices');
        if (!data.items.length) {
          list.replaceChildren(h('li', { class: 'empty' }, t('Pa gen tablèt aktive ankò.')));
          return;
        }
        list.replaceChildren(...data.items.map(deviceRow));
      } catch (err) {
        list.replaceChildren(h('li', { class: 'empty' }, err.message));
      }
    }

    function deviceRow(d) {
      const seen = d.last_seen_at
        ? t('Dènye aktivite: {date}', { date: fmt.dateTime(d.last_seen_at) })
        : t('Poko itilize');
      const status = d.is_active
        ? h('span', { class: 'badge badge-approved' }, t('Aktif'))
        : h('span', { class: 'badge badge-rejected' },
            t('Dezaktive {date}', { date: fmt.shortDate(d.revoked_at) }));

      let action = null;
      if (d.is_active) {
        action = h('button', { class: 'btn btn-danger btn-sm', type: 'button' }, t('Dezaktive'));
        action.addEventListener('click', async () => {
          if (!confirm(t('Dezaktive {name}? Tablèt la p ap ka pwente ankò.', { name: d.name }))) return;
          action.disabled = true;
          try {
            await api.del(`/api/kiosk/devices/${d.id}`);
            await loadDevices();
          } catch (err) {
            alert(err.message);
            action.disabled = false;
          }
        });
      }

      return h('li', {},
        h('div', {},
          h('div', {}, d.name),
          h('div', { class: 'sub' }, seen),
        ),
        h('div', { style: 'display: flex; align-items: center; gap: 8px;' }, status, action),
      );
    }

    async function createDevice() {
      $('d-error').textContent = '';
      const name = $('d-name').value.trim();
      if (name.length < 2) {
        $('d-error').textContent = t('Bay tablèt la yon non.');
        $('d-name').focus();
        return null;
      }
      try {
        return await api.post('/api/kiosk/devices', { name });
      } catch (err) {
        $('d-error').textContent = err.message;
        return null;
      }
    }

    // Tablèt sa a: nou sere token an sou aparèy la, nou DEKONEKTE admin lan
    // (pou tablèt la pa rete konekte ak kont li), epi nou louvri paj pwentaj la.
    $('d-here').addEventListener('click', async () => {
      if (!confirm(t('Tablèt sa a ap dekonekte w, epi l ap vin yon tablèt pwentaj. Kontinye?'))) return;
      const btn = $('d-here');
      btn.disabled = true;
      const r = await createDevice();
      if (!r) { btn.disabled = false; return; }
      try { localStorage.setItem(KIOSK_TOKEN_KEY, r.token); } catch { /* navigasyon prive */ }
      try { await api.post('/api/auth/logout'); } catch { /* token deja ekspire */ }
      try {
        localStorage.removeItem('konbit.access_token');
        localStorage.removeItem('konbit.refresh_token');
      } catch { /* anyen */ }
      location.href = 'kiosk.html';
    });

    // Lòt tablèt: yon kòd kout (K7P-4QX), 10 minit, yon sèl fwa.
    // Tablèt la parèt nan lis la depi yo tape kòd la sou li.
    $('d-other').addEventListener('click', async () => {
      $('d-error').textContent = '';
      const name = $('d-name').value.trim();
      if (name.length < 2) {
        $('d-error').textContent = t('Bay tablèt la yon non.');
        $('d-name').focus();
        return;
      }
      const btn = $('d-other');
      btn.disabled = true;
      try {
        const r = await api.post('/api/kiosk/pairings', { name });
        $('d-name').value = '';
        showSecret(
          t('Kòd tablèt pou {name}', { name: r.name }),
          r.code,
          t('Kòd sa a mache yon sèl fwa epi li ekspire a {time}. Louvri {url} sou tablèt la epi tape l.', {
            time: fmt.time(r.expires_at),
            url: new URL('kiosk.html', location.href).href,
          }),
        );
      } catch (err) {
        $('d-error').textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    });

    // -----------------------------------------------------------------
    // DEMARAJ
    // -----------------------------------------------------------------
    await Promise.all([loadMode(), loadDevices()]);
  })();
  </script>
</body>
</html>
