<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Peyòl — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <aside id="sidebar"></aside>

    <div class="app-main">
      <header class="topbar" id="topbar"></header>

      <main class="page">
        <div class="page-head-row">
          <div class="page-head">
            <h1 data-i18n>Peyòl</h1>
            <p data-i18n>Kreye yon peryòd, kalkile fich peye yo, verifye yo, apwouve, epi make yo peye.</p>
          </div>
          <button class="btn btn-primary" type="button" id="new-btn" data-i18n>Nouvo peryòd</button>
        </div>

        <section class="panel form-panel" id="new-panel" hidden aria-labelledby="new-title">
          <div class="panel-head"><h2 id="new-title" data-i18n>Nouvo peryòd peye</h2></div>
          <form id="new-form" novalidate>
            <div class="form-grid">
              <div class="field span-2">
                <label for="p-name" data-i18n>Non peryòd la</label>
                <input class="input" id="p-name" maxlength="100" autocomplete="off">
              </div>
              <div class="field">
                <label for="p-start" data-i18n>Premye jou</label>
                <input class="input" id="p-start" type="date">
              </div>
              <div class="field">
                <label for="p-end" data-i18n>Dènye jou</label>
                <input class="input" id="p-end" type="date">
              </div>
              <div class="field">
                <label for="p-pay" data-i18n>Dat peman</label>
                <input class="input" id="p-pay" type="date">
                <span class="hint" id="p-pay-hint"></span>
              </div>
            </div>
            <p class="field-error" id="new-error" role="alert" style="margin-top: 12px;"></p>
            <div class="form-actions">
              <button class="btn btn-primary" type="submit" id="new-submit" data-i18n>Kreye peryòd la</button>
              <button class="btn btn-ghost" type="button" id="new-cancel" data-i18n="Anile|aksyon">Anile</button>
            </div>
          </form>
        </section>

        <div id="detail"></div>

        <section class="panel" aria-labelledby="periods-title" style="margin-top: 20px;">
          <div class="panel-head"><h2 id="periods-title" data-i18n>Tout peryòd yo</h2></div>
          <div id="periods"><p class="loading" data-i18n>Ap chaje…</p></div>
        </section>
      </main>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="shell.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, fmt, h, ApiError, shell, t } = Konbit;

    const identity = await shell.mount('payroll', shell.ADMIN);
    if (!identity) return;

    const $ = (id) => document.getElementById(id);
    const STATUS = {
      draft: ['Bouyon', 'badge-pending'],
      approved: ['Apwouve', 'badge-info'],
      paid: ['Peye|estati', 'badge-approved'],
      cancelled: ['Anile', 'badge-cancelled'],
    };

    let periods = [];
    let selectedId = Number(new URLSearchParams(location.search).get('id')) || null;
    let lastWarnings = [];

    // ---------------------------------------------------------------------
    // ZOUTI
    // ---------------------------------------------------------------------

    function errorMessage(err) {
      let msg = err instanceof ApiError ? err.message : t('Yon bagay pa mache.');
      if (err && err.fields && err.fields.length) {
        msg += ' ' + err.fields.map((f) => `${f.field}: ${f.message}`).join('; ');
      }
      return msg;
    }

    function iso(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function statusBadge(status) {
      const [key, cls] = STATUS[status] || [null, ''];
      return h('span', { class: `badge ${cls}` }, key ? t(key) : status);
    }

    function deductionsOf(s) {
      return (s.tax_amount || 0) + (s.supplemental_tax_amount || 0) + (s.ona_amount || 0)
        + (s.ofatma_amount || 0) + (s.cfgdct_amount || 0) + (s.fdu_cas_amount || 0)
        + (s.other_deductions || 0);
    }

    // Toujou fr-FR pou chan yo: parseMoney li l nan tout lang, epi chif yo rete 0-9.
    function centsToInput(cents) {
      if (!cents) return '';
      return (cents / 100).toLocaleString('fr-FR', { maximumFractionDigits: 2 });
    }

    /** Non metòd peman an pou rezime a ("3 × Chèk"). */
    function methodName(m) {
      return {
        check: t('Chèk'), direct_deposit: t('Depo dirèk'), cash: t('Lajan kach'),
        moncash: 'MonCash', natcash: 'NatCash',
      }[m] || m;
    }

    function selectPeriod(id) {
      selectedId = id;
      lastWarnings = [];
      const url = new URL(location.href);
      url.searchParams.set('id', String(id));
      history.replaceState(null, '', url);
      renderPeriods();
      loadDetail();
    }

    /**
     * Konfimasyon nan paj la olye fenèt navigatè a. Retounen yon eleman:
     * premye klik montre kesyon an, dezyèm klik egzekite aksyon an.
     */
    function confirmButton(label, question, className, onConfirm) {
      const wrap = h('div', { class: 'confirm-wrap' });
      const btn = h('button', { class: className, type: 'button' }, label);
      wrap.append(btn);

      btn.addEventListener('click', () => {
        const yesClass = className.includes('danger') ? className : 'btn btn-primary';
        const yes = h('button', { class: yesClass, type: 'button' }, t('Wi, kontinye'));
        const no = h('button', { class: 'btn btn-ghost btn-sm', type: 'button' }, t('Anile|aksyon'));
        const box = h('div', { class: 'confirm-box', role: 'alertdialog' },
          h('p', {}, question),
          h('div', { class: 'form-actions', style: 'margin-top: 12px;' }, yes, no),
        );
        wrap.replaceChildren(box);
        yes.focus();
        no.addEventListener('click', () => wrap.replaceChildren(btn));
        yes.addEventListener('click', async () => {
          yes.disabled = true; no.disabled = true;
          yes.textContent = t('Yon ti moman…');
          await onConfirm();
        });
      });
      return wrap;
    }

    // ---------------------------------------------------------------------
    // NOUVO PERYÒD
    // ---------------------------------------------------------------------

    function prefillNewPeriod() {
      // Pwopoze pwochen mwa ki poko gen peryòd, oswa mwa sa a.
      const today = new Date();
      let y = today.getFullYear();
      let m = today.getMonth();
      const taken = new Set(periods.map((p) => p.start_date.slice(0, 7)));
      for (let i = 0; i < 12; i++) {
        const key = `${y}-${String(m + 1).padStart(2, '0')}`;
        if (!taken.has(key)) break;
        m += 1; if (m > 11) { m = 0; y += 1; }
      }
      const start = new Date(y, m, 1);
      const end = new Date(y, m + 1, 0);
      const pay = new Date(y, m + 1, 5);
      // Non an nan lang moun nan ("Oktòb 2026", "October 2026"). Li sere jan l ekri a.
      const month = fmt.MONTHS[m];
      $('p-name').value = `${month.charAt(0).toLocaleUpperCase()}${month.slice(1)} ${y}`;
      $('p-start').value = iso(start);
      $('p-end').value = iso(end);
      $('p-pay').value = iso(pay);
      updatePayHint();
    }

    function updatePayHint() {
      // Retni sou bonis la depann de dat peman an (10% → 15% nan 1ye okt. 2026).
      const v = $('p-pay').value;
      $('p-pay-hint').textContent = v
        ? t('Retni sou bonis ak èdtan siplemantè: {rate}', { rate: v >= '2026-10-01' ? '15%' : '10%' })
        : '';
    }

    $('p-pay').addEventListener('change', updatePayHint);

    $('new-btn').addEventListener('click', () => {
      prefillNewPeriod();
      $('new-panel').hidden = false;
      $('new-btn').hidden = true;
      $('p-name').focus();
    });

    function closeNew() {
      $('new-panel').hidden = true;
      $('new-btn').hidden = false;
      $('new-error').textContent = '';
    }
    $('new-cancel').addEventListener('click', closeNew);

    $('new-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      $('new-error').textContent = '';
      const payload = {
        name: $('p-name').value.trim(),
        start_date: $('p-start').value,
        end_date: $('p-end').value,
        pay_date: $('p-pay').value,
      };
      if (!payload.name || !payload.start_date || !payload.end_date || !payload.pay_date) {
        $('new-error').textContent = t('Ranpli tout chan yo.');
        return;
      }
      if (payload.end_date < payload.start_date) {
        $('new-error').textContent = t('Dènye jou a pa ka anvan premye jou a.');
        return;
      }
      if (payload.pay_date < payload.end_date) {
        $('new-error').textContent = t('Dat peman an pa ka anvan fen peryòd la.');
        return;
      }

      $('new-submit').disabled = true;
      try {
        const created = await api.post('/api/payroll/periods', payload);
        closeNew();
        await loadPeriods();
        selectPeriod(created.id);
      } catch (err) {
        $('new-error').textContent = errorMessage(err);
      } finally {
        $('new-submit').disabled = false;
      }
    });

    // ---------------------------------------------------------------------
    // LIS PERYÒD
    // ---------------------------------------------------------------------

    async function loadPeriods() {
      try {
        const data = await api.get('/api/payroll/periods?limit=50');
        periods = data.items;
        if (!selectedId && periods.length) selectedId = periods[0].id;
        renderPeriods();
      } catch (err) {
        $('periods').replaceChildren(h('p', { class: 'empty' }, errorMessage(err)));
      }
    }

    function renderPeriods() {
      if (!periods.length) {
        $('periods').replaceChildren(h('p', { class: 'empty' },
          t('Ou poko gen okenn peryòd. Klike "Nouvo peryòd" pou kòmanse premye peyòl ou.')));
        return;
      }
      $('periods').replaceChildren(h('div', { class: 'table-wrap flush' },
        h('table', { class: 'table' },
          h('thead', {}, h('tr', {},
            h('th', { scope: 'col' }, t('Peryòd')),
            h('th', { scope: 'col', class: 'hide-sm' }, t('Dat')),
            h('th', { scope: 'col' }, t('Estati')),
            h('th', { scope: 'col', class: 'num-col hide-sm' }, t('Fich')),
            h('th', { scope: 'col', class: 'num-col' }, t('Total net')),
          )),
          h('tbody', {}, ...periods.map((p) => {
            const link = h('a', { class: 'plain-link', href: `?id=${p.id}` }, p.name);
            link.addEventListener('click', (e) => { e.preventDefault(); selectPeriod(p.id); });
            return h('tr', { class: p.id === selectedId ? 'is-selected' : null },
              h('td', {}, h('span', { class: 'who' }, link)),
              h('td', { class: 'cell-muted hide-sm' }, `${fmt.shortDate(p.start_date)} – ${fmt.shortDate(p.end_date)}`),
              h('td', {}, statusBadge(p.status)),
              h('td', { class: 'num-col cell-muted hide-sm' }, String(p.payslip_count)),
              h('td', { class: 'num-col' }, p.total_net ? fmt.money(p.total_net) : '—'),
            );
          })),
        ),
      ));
    }

    // ---------------------------------------------------------------------
    // DETAY YON PERYÒD
    // ---------------------------------------------------------------------

    async function loadDetail() {
      const box = $('detail');
      if (!selectedId) { box.replaceChildren(); return; }
      box.replaceChildren(h('section', { class: 'panel' }, h('p', { class: 'loading' }, t('Ap chaje…'))));

      try {
        const [period, slips] = await Promise.all([
          api.get(`/api/payroll/periods/${selectedId}`),
          api.get(`/api/payroll/periods/${selectedId}/payslips`),
        ]);
        renderDetail(period, slips.items);
      } catch (err) {
        box.replaceChildren(h('div', { class: 'alert alert-error' }, errorMessage(err)));
      }
    }

    async function refresh() {
      await loadPeriods();
      await loadDetail();
    }

    function stepper(status) {
      const steps = [['draft', t('Kalkile ak verifye')], ['approved', t('Apwouve')], ['paid', t('Peye|estati')]];
      const reached = { draft: 0, approved: 1, paid: 2 }[status] ?? 0;
      return h('ol', { class: 'stepper', 'aria-label': t('Etap peyòl la') },
        ...steps.map(([key, label], i) => h('li', {
          class: i < reached ? 'done' : i === reached ? 'current' : null,
          'aria-current': i === reached ? 'step' : null,
        }, h('span', { class: 'step-n' }, String(i + 1)), label)),
      );
    }

    /**
     * Kalkile fich peye yo. Si backend la reponn 409 (gen moun ki poko gen
     * èdtan apwouve pa manadjè yo), nou montre lis la ak de chwa: ale
     * apwouve yo, oswa kontinye — moun sa yo p ap touche èdtan siplemantè.
     */
    async function runPayroll(period, confirmUnapproved) {
      const query = confirmUnapproved ? '?confirm_unapproved=true' : '';
      const r = await api.post(`/api/payroll/periods/${period.id}/run${query}`, {
        pay_period_id: period.id,
        include_overtime: true,
      });
      // Avètisman backend yo ekri an kreyòl (pa tradui ankò).
      lastWarnings = r.warnings || [];
      if (r.unapproved && r.unapproved.length) {
        lastWarnings.unshift(t('Kalkile san èdtan apwouve (salè de baz sèlman, pa èdtan siplemantè): {names}.',
          { names: r.unapproved.join(', ') }));
      }
      if (r.created === 0 && r.skipped > 0 && !lastWarnings.length) {
        lastWarnings = [t('Tout anplwaye aktif yo gen fich yo deja.')];
      }
      await refresh();
    }

    function unapprovedBox(period, message, runBtn, msg) {
      const box = h('div', { class: 'alert alert-warn', role: 'alertdialog', style: 'margin-top: 14px;' });
      const go = h('button', { class: 'btn btn-primary btn-sm', type: 'button' },
        t('Kontinye san èdtan siplemantè yo'));
      const review = h('a', { class: 'btn btn-ghost btn-sm', href: 'timesheets.html' },
        t('Ale nan Tan travay'));
      const cancel = h('button', { class: 'btn btn-quiet btn-sm', type: 'button' }, t('Anile|aksyon'));

      go.addEventListener('click', async () => {
        go.disabled = true; cancel.disabled = true;
        go.textContent = t('Ap kalkile…');
        try {
          await runPayroll(period, true);
        } catch (err) {
          box.remove();
          msg.textContent = errorMessage(err);
          runBtn.disabled = false;
        }
      });
      cancel.addEventListener('click', () => {
        box.remove();
        runBtn.disabled = false;
      });

      box.append(
        h('strong', {}, t('Èdtan kèk moun poko apwouve.')),
        h('p', { style: 'margin: 6px 0 0;' }, message),
        h('p', { class: 'hint', style: 'display: block; margin: 6px 0 0;' },
          t('Manadjè a dwe apwouve èdtan yo nan paj "Tan travay". Si w kontinye kounye a, ou ka toujou ajoute èdtan siplemantè yo pita kòm bonis sou fich la.')),
        h('div', { class: 'form-actions', style: 'margin-top: 12px;' }, go, review, cancel),
      );
      return box;
    }

    function renderDetail(period, rows) {
      const box = $('detail');
      const msg = h('p', { class: 'field-error', role: 'status' });
      const slips = rows.map((r) => r.payslip);

      const totals = slips.reduce((tot, s) => {
        tot.gross += s.gross_amount || 0;
        tot.ded += deductionsOf(s);
        tot.net += s.net_amount || 0;
        tot.methods[s.payment_method] = (tot.methods[s.payment_method] || 0) + 1;
        return tot;
      }, { gross: 0, ded: 0, net: 0, methods: {} });

      // --- Aksyon dapre estati a ---
      const actions = h('div', { class: 'period-actions' });

      if (period.status === 'draft') {
        const label = slips.length ? t('Ajoute moun ki manke yo') : t('Kalkile fich peye yo');
        const runBtn = h('button', { class: 'btn btn-primary', type: 'button' }, label);
        runBtn.addEventListener('click', async () => {
          runBtn.disabled = true;
          runBtn.textContent = t('Ap kalkile…');
          msg.textContent = '';
          try {
            await runPayroll(period, false);
          } catch (err) {
            runBtn.textContent = label;
            if (err instanceof ApiError && err.status === 409) {
              actions.after(unapprovedBox(period, err.message, runBtn, msg));
            } else {
              msg.textContent = errorMessage(err);
              runBtn.disabled = false;
            }
          }
        });
        actions.append(runBtn);
        actions.append(h('a', { class: 'btn btn-ghost', href: 'timesheets.html' }, t('Tan travay')));

        if (slips.length) {
          actions.append(confirmButton(
            t('Apwouve peyòl la'),
            t('Apre apwobasyon, ou p ap ka chanje {count} fich yo ankò, epi anplwaye yo ap ka wè yo. Total net: {net}.',
              { count: slips.length, net: fmt.money(totals.net) }),
            'btn btn-ghost',
            async () => {
              try {
                await api.post(`/api/payroll/periods/${period.id}/approve`);
                lastWarnings = [];
                await refresh();
              } catch (err) {
                msg.textContent = errorMessage(err);
                await loadDetail();
              }
            },
          ));
        }
      }

      if (period.status === 'approved') {
        const checks = totals.methods.check || 0;
        const checkInput = h('input', { class: 'input', id: 'check-start', inputmode: 'numeric',
          placeholder: t('Egz: 1001'), style: 'max-width: 180px;' });
        const payBtn = h('button', { class: 'btn btn-primary', type: 'button' }, t('Make l peye'));

        payBtn.addEventListener('click', async () => {
          msg.textContent = '';
          const raw = checkInput.value.trim();
          if (raw && !/^\d+$/.test(raw)) { msg.textContent = t('Nimewo chèk la dwe yon chif.'); return; }
          payBtn.disabled = true;
          payBtn.textContent = t('Ap anrejistre…');
          try {
            await api.post(`/api/payroll/periods/${period.id}/pay`,
              raw ? { check_start_number: Number(raw) } : {});
            await refresh();
          } catch (err) {
            msg.textContent = errorMessage(err);
            payBtn.disabled = false;
            payBtn.textContent = t('Make l peye');
          }
        });

        actions.append(
          checks
            ? h('div', { class: 'field inline-field' },
                h('label', { for: 'check-start' }, t('Premye nimewo chèk ({count} chèk)', { count: checks })),
                checkInput)
            : null,
          payBtn,
        );
      }

      // --- Rezime ---
      const methodLine = Object.entries(totals.methods)
        .map(([m, n]) => `${n} × ${methodName(m)}`).join(', ');

      const stat = (n, label) => h('div', { class: 'stat' }, h('div', { class: 'n' }, n), h('div', { class: 't' }, label));

      box.replaceChildren(h('section', { class: 'panel period-panel' },
        h('div', { class: 'period-head' },
          h('div', {},
            h('h2', { class: 'period-title' }, period.name, ' ', statusBadge(period.status)),
            h('p', { class: 'cell-muted' },
              `${fmt.date(period.start_date)} – ${fmt.date(period.end_date)}. `
              + (period.status === 'paid'
                ? t('Peye.')
                : t('Peman prevwa {date}.', { date: fmt.date(period.pay_date) }))),
          ),
          stepper(period.status),
        ),

        lastWarnings.length
          ? h('div', { class: 'alert alert-warn' },
              h('strong', {}, t('Pou verifye:')),
              h('ul', {}, ...lastWarnings.map((w) => h('li', {}, w))))
          : null,

        slips.length
          ? h('div', { class: 'stat-line period-stats' },
              stat(fmt.money(totals.gross), t('brit')),
              stat(fmt.money(totals.ded), t('dediksyon')),
              stat(fmt.money(totals.net), t('net pou peye')),
              stat(String(slips.length), methodLine || t('fich')),
            )
          : h('p', { class: 'empty' }, t('Pa gen fich peye pou peryòd sa a ankò. Klike "Kalkile fich peye yo".')),

        actions,
        msg,

        slips.length ? payslipTable(rows, period) : null,
      ));
    }

    // ---------------------------------------------------------------------
    // TABLO FICH PEYE
    // ---------------------------------------------------------------------

    function payslipTable(rows, period) {
      const editable = period.status === 'draft';
      const tbody = h('tbody');

      rows.forEach(({ payslip: s, employee_name, employee_number }) => {
        const detailRow = h('tr', { class: 'detail-row', hidden: true },
          h('td', { colspan: '6' }, breakdown(s, editable)));

        const toggle = h('button', { class: 'btn btn-quiet btn-sm', type: 'button', 'aria-expanded': 'false' },
          editable ? t('Detay / ajiste') : t('Detay'));
        toggle.addEventListener('click', () => {
          detailRow.hidden = !detailRow.hidden;
          toggle.setAttribute('aria-expanded', String(!detailRow.hidden));
        });

        // Èdtan siplemantè ki pa t peye paske yo pa t apwouve
        const unpaidOt = s.overtime_hours > 0 && !s.overtime_amount;

        tbody.append(
          h('tr', {},
            h('td', {},
              h('div', { class: 'who' }, employee_name),
              h('div', { class: 'num' }, employee_number),
              unpaidOt ? h('span', { class: 'badge badge-pending', style: 'font-size: 11px;' },
                t('{hours} è siplemantè pa peye', { hours: s.overtime_hours })) : null,
            ),
            h('td', { class: 'num-col hide-sm' }, fmt.money(s.gross_amount)),
            h('td', { class: 'num-col hide-sm cell-muted' }, `−${fmt.money(deductionsOf(s))}`),
            h('td', { class: 'num-col strong' }, fmt.money(s.net_amount)),
            h('td', { class: 'cell-muted' }, fmt.paymentMethod(s)),
            h('td', { class: 'actions' }, toggle),
          ),
          detailRow,
        );
      });

      return h('div', { class: 'table-wrap flush', style: 'margin-top: 18px;' },
        h('table', { class: 'table' },
          h('thead', {}, h('tr', {},
            h('th', { scope: 'col' }, t('Anplwaye')),
            h('th', { scope: 'col', class: 'num-col hide-sm' }, t('Brit')),
            h('th', { scope: 'col', class: 'num-col hide-sm' }, t('Dediksyon')),
            h('th', { scope: 'col', class: 'num-col' }, t('Net')),
            h('th', { scope: 'col' }, t('Peman')),
            h('th', { scope: 'col' }, h('span', { class: 'visually-hidden' }, t('Aksyon'))),
          )),
          tbody,
        ),
      );
    }

    function breakdown(s, editable) {
      const line = (k, v, minus) => v
        ? h('div', { class: minus ? 'row minus' : 'row' },
            h('span', { class: 'k' }, k),
            h('span', { class: 'v' }, `${minus ? '−' : ''}${fmt.money(v)}`))
        : null;

      // Non ofisyèl yo (IRI, ONA, OFATMA, CFGDCT, FDU / CAS) pa tradui.
      const rowsBox = h('div', { class: 'rows' },
        line(t('Salè debaz'), s.base_amount),
        line(t('Èdtan siplemantè'), s.overtime_amount),
        s.overtime_hours > 0 && !s.overtime_amount
          ? h('div', { class: 'row' },
              h('span', { class: 'k' }, t('Èdtan siplemantè pa apwouve ({hours} è)', { hours: s.overtime_hours })),
              h('span', { class: 'v' }, t('pa peye')))
          : null,
        line(t('Bonis'), s.bonus_amount),
        h('div', { class: 'row' }, h('span', { class: 'k' }, t('Brit')), h('span', {}, fmt.money(s.gross_amount))),
        line('IRI', s.tax_amount, true),
        line(t('Retni sou bonis / èdtan siplemantè'), s.supplemental_tax_amount, true),
        line('ONA', s.ona_amount, true),
        line('OFATMA', s.ofatma_amount, true),
        line('CFGDCT', s.cfgdct_amount, true),
        line('FDU / CAS', s.fdu_cas_amount, true),
        line(t('Lòt dediksyon'), s.other_deductions, true),
        h('div', { class: 'row total' }, h('span', {}, t('Net')), h('span', {}, fmt.money(s.net_amount))),
      );

      if (!editable) return h('div', { class: 'breakdown-grid' }, rowsBox);

      // --- Fòm ajisteman (bouyon sèlman) ---
      const bonus = h('input', { class: 'input', inputmode: 'decimal', id: `b-${s.id}` });
      bonus.value = centsToInput(s.bonus_amount);
      const other = h('input', { class: 'input', inputmode: 'decimal', id: `o-${s.id}` });
      other.value = centsToInput(s.other_deductions);
      const method = h('select', { class: 'select', id: `m-${s.id}` },
        ...['check', 'direct_deposit', 'moncash', 'natcash', 'cash']
          .map((v) => h('option', { value: v }, methodName(v))));
      method.value = s.payment_method;
      const note = h('input', { class: 'input', id: `n-${s.id}`, maxlength: '500',
        placeholder: t('Egz: Bonis fen ane') });
      const msg = h('p', { class: 'field-error', role: 'status' });
      const save = h('button', { class: 'btn btn-primary btn-sm', type: 'submit' }, t('Rekalkile'));

      const form = h('form', { class: 'adjust-form', novalidate: true },
        h('div', { class: 'field' }, h('label', { for: bonus.id }, t('Bonis (HTG)')), bonus),
        h('div', { class: 'field' }, h('label', { for: other.id }, t('Lòt dediksyon (HTG)')), other,
          h('span', { class: 'hint' }, t('Avans sou salè, prè, elatriye.'))),
        h('div', { class: 'field' }, h('label', { for: method.id }, t('Peman')), method),
        h('div', { class: 'field' }, h('label', { for: note.id }, t('Nòt')), note),
        msg,
        h('div', {}, save),
      );

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        msg.textContent = '';
        const b = bonus.value.trim() ? fmt.parseMoney(bonus.value) : 0;
        const o = other.value.trim() ? fmt.parseMoney(other.value) : 0;
        if (b === null || o === null) { msg.textContent = t('Montan yo dwe chif valab.'); return; }

        const changes = {};
        if (b !== (s.bonus_amount || 0)) changes.bonus_amount = b;
        if (o !== (s.other_deductions || 0)) changes.other_deductions = o;
        if (method.value !== s.payment_method) changes.payment_method = method.value;
        if (note.value.trim()) changes.notes = note.value.trim();

        if (!Object.keys(changes).length) { msg.textContent = t('Pa gen anyen ki chanje.'); return; }

        save.disabled = true;
        save.textContent = t('Ap rekalkile…');
        try {
          await api.patch(`/api/payroll/payslips/${s.id}`, changes);
          await refresh();
        } catch (err) {
          msg.textContent = errorMessage(err);
          save.disabled = false;
          save.textContent = t('Rekalkile');
        }
      });

      return h('div', { class: 'breakdown-grid' }, rowsBox, form);
    }

    // ---------------------------------------------------------------------
    // DEMARAJ
    // ---------------------------------------------------------------------
    await loadPeriods();
    await loadDetail();
  })();
  </script>
</body>
</html>
