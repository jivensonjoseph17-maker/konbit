<!DOCTYPE html>
<html lang="ht">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n>Chanje modpas — KONMBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="app.css">
  <style>
    .pw-page { min-height: 100vh; display: grid; place-items: center; padding: 32px 20px; }
    .pw-card { width: 100%; max-width: 440px; }
    .pw-card .brand { margin-bottom: 28px; }
    .pw-links { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; font-size: 14px; }
  </style>
</head>
<body>
  <main class="pw-page">
    <div class="pw-card panel">
      <a class="brand" href="index.html" data-i18n-attr="aria-label" aria-label="KONMBIT — akèy">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span class="brand-name">KONMBIT</span>
      </a>

      <h1 id="pw-title" style="font-size: 22px; font-weight: 700;" data-i18n>Chanje modpas</h1>
      <p class="sub" id="pw-intro" hidden style="color: var(--muted); margin-top: 6px;" data-i18n>Modpas ou te resevwa a se yon modpas tanporè. Chwazi yon lòt ke se ou sèlman ki konnen.</p>

      <form class="auth-form" id="pw-form" novalidate>
        <div class="alert alert-error" id="pw-error" role="alert"></div>

        <div class="field">
          <label for="pw-current" data-i18n>Modpas aktyèl la</label>
          <input class="input" id="pw-current" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label for="pw-new" data-i18n>Nouvo modpas</label>
          <input class="input" id="pw-new" type="password" autocomplete="new-password"
                 minlength="10" required aria-describedby="pw-hint">
          <span class="hint" id="pw-hint" data-i18n>Omwen 10 karaktè, ak lèt ak chif.</span>
        </div>
        <div class="field">
          <label for="pw-confirm" data-i18n>Konfime nouvo modpas la</label>
          <input class="input" id="pw-confirm" type="password" autocomplete="new-password" required>
        </div>

        <button class="btn btn-primary" type="submit" id="pw-submit" data-i18n>Anrejistre nouvo modpas la</button>
      </form>

      <div class="pw-links">
        <a class="plain-link" href="dashboard.html" id="pw-back" data-i18n>Retounen nan tablo de bò a</a>
        <button class="link-btn" type="button" id="pw-logout" data-i18n>Dekonekte</button>
      </div>
    </div>
  </main>

  <script src="api.js"></script>
  <script>
  (async function () {
    'use strict';
    const { api, auth, ApiError, i18n, t } = Konbit;

    if (!auth.requireLogin()) return;
    await i18n.ready;

    const $ = (id) => document.getElementById(id);
    let forced = false;

    try {
      const identity = await api.get('/api/auth/identity');
      forced = Boolean(identity.user.must_change_password);
    } catch {
      /* api.js voye moun nan nan paj koneksyon an si sesyon an fini */
    }

    if (forced) {
      $('pw-title').textContent = t('Chwazi pwòp modpas ou');
      $('pw-intro').hidden = false;
      $('pw-back').hidden = true;         // pa gen kote pou ale anvan modpas la chanje
    }

    $('pw-logout').addEventListener('click', () => auth.logout());

    $('pw-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const error = $('pw-error');
      error.textContent = '';

      const current = $('pw-current').value;
      const next = $('pw-new').value;
      if (!current || !next || !$('pw-confirm').value) {
        error.textContent = t('Ranpli tout chan ki obligatwa yo.');
        return;
      }
      if (next.length < 10 || !/\d/.test(next) || !/[a-zA-Z]/.test(next)) {
        error.textContent = t('Modpas la dwe gen omwen 10 karaktè, ak lèt ak chif.');
        return;
      }
      if (next !== $('pw-confirm').value) {
        error.textContent = t('De modpas yo pa menm.');
        return;
      }

      const btn = $('pw-submit');
      btn.disabled = true;
      btn.textContent = t('Yon ti moman…');
      try {
        await api.post('/api/auth/change-password', { current_password: current, new_password: next });
        location.replace('dashboard.html');
      } catch (err) {
        error.textContent = err instanceof ApiError ? err.message : t('Yon bagay pa mache. Eseye ankò.');
        btn.disabled = false;
        btn.textContent = t('Anrejistre nouvo modpas la');
      }
    });
  })();
  </script>
</body>
</html>
