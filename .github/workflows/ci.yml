# Konbit — Tès otomatik sou chak push
# Chemen: .github/workflows/ci.yml
#
# 1. pytest (SQLite, menm jan ak sou machin ou)
# 2. Migrasyon Alembic yo sou yon VRÈ PostgreSQL 16 — menm vèsyon ak Render.
#    Se sa DEPLOYMENT.md (Etap 4) mande anvan pwodiksyon.
# 3. Tradiksyon yo: pa gen fraz ki manke nan okenn lang.
#
# SECRET_KEY: pa gen okenn kle ekri nan fichye sa a. Chak run jenere pwòp
# kle o aza pa l, ki disparèt lè machin CI a fèmen. Kle PWODIKSYON an rete
# SÈLMAN nan Render (Environment) ak nan jeretè modpas ou.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Jenere yon SECRET_KEY pou run sa a sèlman
        run: |
          KEY="$(python -c 'import secrets; print(secrets.token_hex(48))')"
          echo "::add-mask::$KEY"
          echo "SECRET_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Enstale depandans yo
        run: pip install -r backend/requirements.txt "psycopg[binary]>=3.2"
      - name: pytest
        run: python -m pytest -q
      - name: Mesaj backend ki pa tradui
        working-directory: backend
        run: python scripts/i18n_missing.py
      - name: Tradiksyon frontend
        run: python frontend/i18n/check_i18n.py

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: konmbit
          POSTGRES_PASSWORD: konmbit
          POSTGRES_DB: konmbit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U konmbit"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Baz done tanporè CI a sèlman (li disparèt apre run lan). Pa yon sekrè.
      DATABASE_URL: postgresql://konmbit:konmbit@localhost:5432/konmbit_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Jenere yon SECRET_KEY pou run sa a sèlman
        run: |
          KEY="$(python -c 'import secrets; print(secrets.token_hex(48))')"
          echo "::add-mask::$KEY"
          echo "SECRET_KEY=$KEY" >> "$GITHUB_ENV"
      - name: Enstale depandans yo
        run: pip install -r requirements.txt "psycopg[binary]>=3.2"
      - name: alembic upgrade head (PostgreSQL)
        run: alembic upgrade head
      - name: Verifye tab yo egziste
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.config import settings
          tables = inspect(create_engine(settings.database_url)).get_table_names()
          print(f"{len(tables)} tab:", ", ".join(sorted(tables)))
          assert len(tables) >= 15, "twò pe tab: yon migrasyon pa pase nèt"
          PY