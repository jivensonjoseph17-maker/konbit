# Konbit — Backup chak jou baz done PostgreSQL la
# Chemen: .github/workflows/backup.yml
#
# 1. pg_dump baz done pwodiksyon an (fòma "custom", -Fc).
# 2. Chifre l ak GPG (AES256) ak BACKUP_PASSPHRASE.
# 3. Sere fichye chifre a kòm "artifact" GitHub pandan 30 jou.
#
# SEKRÈ (Settings → Secrets and variables → Actions):
#   DATABASE_URL_BACKUP  — "External Database URL" Render la (postgres://...)
#   BACKUP_PASSPHRASE    — yon fraz long; SERE L YON LÒT KOTE TOU.
#                          San li, backup yo pa ka louvri.
#
# Tanke sekrè yo pa la (anvan deplwaman), workflow la sote san echwe.
#
# RESTORE (sou òdinatè w, ak PostgreSQL 16+ enstale):
#   gpg --decrypt konbit-AAAA-MM-JJ.dump.gpg > konbit.dump
#   pg_restore --clean --if-exists --no-owner -d "<URL baz done a>" konbit.dump
#
# NÒT: si repo a piblik, nenpòt moun ki konekte sou GitHub ka telechaje
# artifact yo. Se poutèt sa chifreman an obligatwa.

name: Backup

on:
  schedule:
    - cron: "0 7 * * *"      # chak jou a 07:00 UTC (03:00 lè Ayiti)
  workflow_dispatch:          # bouton "Run workflow" pou teste alamen

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Tcheke sekrè yo
        id: check
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::notice::DATABASE_URL_BACKUP oswa BACKUP_PASSPHRASE pa mete. Pa gen backup."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Enstale kliyan PostgreSQL
        if: steps.check.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client gnupg
          pg_dump --version

      - name: pg_dump + chifreman
        if: steps.check.outputs.enabled == 'true'
        id: dump
        run: |
          set -euo pipefail
          STAMP="$(TZ=America/Port-au-Prince date +%F)"
          OUT="konbit-${STAMP}.dump"

          pg_dump --format=custom --no-owner --no-privileges \
                  --file="$OUT" "$DATABASE_URL"

          # Yon backup vid oswa twò piti vle di gen yon pwoblèm.
          SIZE=$(stat -c %s "$OUT")
          if [ "$SIZE" -lt 1024 ]; then
            echo "::error::Backup la twò piti ($SIZE byte). Verifye baz done a."
            exit 1
          fi

          printf '%s' "$BACKUP_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --symmetric --cipher-algo AES256 \
              --output "${OUT}.gpg" "$OUT"

          # Fichye ki pa chifre a pa dwe janm kite machin nan.
          shred -u "$OUT" 2>/dev/null || rm -f "$OUT"

          echo "file=${OUT}.gpg" >> "$GITHUB_OUTPUT"
          echo "Backup: ${OUT}.gpg ($(stat -c %s "${OUT}.gpg") byte chifre)"

      - name: Sere backup la
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.file }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 30
          if-no-files-found: error